<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- EN VIVO Tycoon — ícono de la app: cámara de transmisión con luz de tally "al aire". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#b7c0cf"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6e2"/>
      <stop offset="1" stop-color="#8f9ab0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#ff3b3b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd0d0"/>
      <stop offset="0.35" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#e01e1e"/>
    </radialGradient>
  </defs>

  <!-- fondo -->
  <g id="bgshape">
    <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
    <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2a3242" stroke-width="4"/>
  </g>

  <!-- dibujo -->
  <g id="art">
    <!-- ondas de señal detrás de la luz -->
    <g fill="none" stroke="#ff3b3b" stroke-linecap="round" stroke-width="12" opacity="0.55">
      <path d="M 380 96 A 64 64 0 0 1 380 186"/>
      <path d="M 404 72 A 98 98 0 0 1 404 210"/>
    </g>

    <!-- trípode -->
    <g fill="#5d6880">
      <rect x="236" y="352" width="28" height="78" rx="6"/>
      <path d="M 238 380 L 176 432 L 162 420 L 230 362 Z"/>
      <path d="M 262 380 L 324 432 L 338 420 L 270 362 Z"/>
      <rect x="196" y="340" width="108" height="22" rx="8" fill="#7a859c"/>
    </g>

    <!-- asa / visor superior -->
    <rect x="146" y="166" width="132" height="30" rx="13" fill="#e2e7ef"/>
    <rect x="160" y="190" width="18" height="34" fill="#c4ccda"/>
    <rect x="248" y="190" width="18" height="34" fill="#c4ccda"/>

    <!-- cuerpo -->
    <rect x="104" y="214" width="214" height="132" rx="26" fill="url(#body)"/>
    <!-- panel lateral -->
    <rect x="130" y="240" width="96" height="62" rx="12" fill="#1e2430"/>
    <rect x="144" y="256" width="40" height="8" rx="4" fill="#ffb020"/>
    <rect x="144" y="274" width="62" height="8" rx="4" fill="#4a5468"/>
    <!-- lente -->
    <path d="M 312 236 L 334 236 L 334 324 L 312 324 Z" fill="#9aa5ba"/>
    <path d="M 334 230 L 412 200 Q 422 197 422 207 L 422 353 Q 422 363 412 360 L 334 330 Z" fill="url(#lens)"/>
    <rect x="356" y="214" width="12" height="132" rx="4" fill="#6c778e"/>

    <!-- luz de tally "al aire" -->
    <circle cx="300" cy="150" r="62" fill="url(#halo)"/>
    <circle cx="300" cy="150" r="27" fill="url(#dot)"/>
    <circle cx="300" cy="150" r="27" fill="none" stroke="#0d0f14" stroke-width="5"/>
  </g>
</svg>
