# Construye la app de Android (TWA) de EN VIVO Tycoon con Bubblewrap y la firma con la llave de subida.
# Se corre A MANO: GitHub → Actions → "Android: construir .aab" → Run workflow (pide el número de versión).
# Resultado: un artefacto "envivo-android-<versión>" con app-release-bundle.aab (para Play Console) y
# app-release-signed.apk (para instalar a mano), más las huellas SHA-256 en el resumen.
#
# Secretos que hay que crear en GitHub → Settings → Secrets and variables → Actions (guía: docs/PUBLICAR_GOOGLE_PLAY.md, paso 3):
#   ANDROID_KEYSTORE_BASE64    el archivo android.keystore en base64 (sirve tal cual la salida de `certutil -encode`)
#   ANDROID_KEYSTORE_PASSWORD  la contraseña del keystore
#   ANDROID_KEY_PASSWORD       la contraseña de la llave (si es la misma, se repite)
#   ANDROID_KEY_ALIAS          (opcional) el alias de la llave; si no existe se usa "android"
#
# La llave NUNCA se guarda en el repositorio ni en el artefacto: se escribe en una carpeta temporal del runner
# y se borra al final, pase lo que pase.
name: "Android: construir .aab"

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Número de versión (entero, SIEMPRE mayor que el último subido a Play: 1, 2, 3...)"
        required: true
        type: string
      version_name:
        description: "Nombre de versión que ve el jugador (ej. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUBBLEWRAP_VERSION: "1.27.0"      # la misma que usa docs/ANDROID_GOOGLE_PLAY.md (API 36, Play Billing 8)
      BUILD_TOOLS: "36.1.0"             # BUILD_TOOLS_VERSION de @bubblewrap/core 1.27.0
      PLATFORM: "android-36"
    steps:
      - name: Carpeta de trabajo fuera del repositorio
        run: echo "TWA_DIR=$RUNNER_TEMP/twa" >> "$GITHUB_ENV"

      - name: Revisar que estén los secretos
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VC: ${{ inputs.version_code }}
        run: |
          falta=0
          [ -n "$KS" ]  || { echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64"; falta=1; }
          [ -n "$KSP" ] || { echo "::error::Falta el secreto ANDROID_KEYSTORE_PASSWORD"; falta=1; }
          [ -n "$KP" ]  || { echo "::error::Falta el secreto ANDROID_KEY_PASSWORD"; falta=1; }
          echo "$VC" | grep -Eq '^[1-9][0-9]{0,8}$' || { echo "::error::version_code debe ser un entero positivo (es '$VC')"; falta=1; }
          exit $falta

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"            # Bubblewrap exige JDK 17 exacto

      - name: Instalar Bubblewrap
        run: npm install -g "@bubblewrap/cli@${BUBBLEWRAP_VERSION}"

      - name: Preparar el Android SDK del runner
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || { echo "::error::No encuentro sdkmanager en $SDKM"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;${BUILD_TOOLS}" "platforms;${PLATFORM}" > /dev/null
          # Bubblewrap valida que el SDK tenga una carpeta tools/ o bin/ (formato de su propio SDK).
          if [ ! -d "$SDK/tools" ] && [ ! -d "$SDK/bin" ]; then ln -s "$SDK/cmdline-tools/latest/bin" "$SDK/bin"; fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Preparar el proyecto (twa-manifest.json del repositorio + versión)
        env:
          VC: ${{ inputs.version_code }}
          VN: ${{ inputs.version_name }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$TWA_DIR"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("android/twa-manifest.json", "utf8"));
            m.appVersionCode = parseInt(process.env.VC, 10);
            m.appVersion = process.env.VN;            // Bubblewrap guarda el versionName como "appVersion"
            m.signingKey = { path: process.env.TWA_DIR + "/android.keystore", alias: process.env.ALIAS || "android" };
            fs.writeFileSync(process.env.TWA_DIR + "/twa-manifest.json", JSON.stringify(m, null, 2));
            console.log("packageId:", m.packageId, "| versionCode:", m.appVersionCode, "| versionName:", m.appVersion);
          '

      - name: Escribir la llave de subida (temporal)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Acepta base64 puro o la salida de "certutil -encode" de Windows (con líneas -----BEGIN/END-----).
          printf '%s' "$KS" | grep -v -- '-----' | tr -d '\r\n\t ' | base64 -d > "$TWA_DIR/android.keystore"
          chmod 600 "$TWA_DIR/android.keystore"
          test -s "$TWA_DIR/android.keystore" || { echo "::error::El keystore quedó vacío: revisa ANDROID_KEYSTORE_BASE64"; exit 1; }

      - name: Generar el proyecto Android y construir
        working-directory: ${{ runner.temp }}/twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI: "true"
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          ls -la *.aab *.apk

      - name: Huellas SHA-256 (para .well-known/assetlinks.json)
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VC: ${{ inputs.version_code }}
          VN: ${{ inputs.version_name }}
        run: |
          HUELLA=$(keytool -list -v -keystore "$TWA_DIR/android.keystore" -alias "${ALIAS:-android}" -storepass "$KSP" \
                   | grep -E '^\s*SHA256:' | head -1 | sed -E 's/^\s*SHA256:\s*//')
          {
            echo "## EN VIVO Tycoon · Android $VN (versionCode $VC)"
            echo ""
            echo "Descarga el artefacto **envivo-android-$VC** (abajo) y sube \`app-release-bundle.aab\` a Play Console."
            echo ""
            echo "Huella SHA-256 de la **llave de subida** (la de este keystore):"
            echo ""
            echo "\`$HUELLA\`"
            echo ""
            echo "La huella de la **llave de firma de apps** de Google está en Play Console → Integridad de la app → Firma de apps."
            echo "Las dos van en \`.well-known/assetlinks.json\` (docs/PUBLICAR_GOOGLE_PLAY.md, paso 6)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el .aab y el .apk
        uses: actions/upload-artifact@v4
        with:
          name: envivo-android-${{ inputs.version_code }}
          path: |
            ${{ runner.temp }}/twa/app-release-bundle.aab
            ${{ runner.temp }}/twa/app-release-signed.apk
          if-no-files-found: error
          retention-days: 7

      - name: Borrar la llave del runner
        if: always()
        run: rm -f "$TWA_DIR/android.keystore"
