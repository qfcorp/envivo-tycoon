# EN VIVO Tycoon (juego.tukanec.com): zonas de limite de peticiones para nginx.
# Va en /etc/nginx/conf.d/envivo-limites.conf (lo copia server/deploy/ops/instalar_ops.sh, con "nginx -t" antes de recargar).
#
# Por si solo NO limita nada ni cambia ningun sitio: solo define las zonas. Las usa UNICAMENTE el sitio del juego,
# con las lineas "limit_req zone=envivo_..." dentro de "location ^~ /api/" (ver server/deploy/ops/nginx-endurecer.patch).
# Todos los nombres (zonas y variables) empiezan con envivo_ para no chocar con el ERP ni con TuPass.
#
# Como funciona: cada zona cuenta por IP del jugador (la IP real, tambien detras de Cloudflare) SOLO cuando la
# peticion es un POST a esa direccion. Para cualquier otra direccion la llave queda vacia y nginx no la cuenta.
# Los valores son generosos a proposito: en Ecuador muchos celulares salen a internet con la misma IP (CGNAT).
# PHP tiene ademas sus propios limites mas finos (server/src/Limite.php).

map "$request_method:$uri" $envivo_lim_entrar {
    default "";
    "~^POST:/api/entrar/?$" $binary_remote_addr;
}
map "$request_method:$uri" $envivo_lim_registro {
    default "";
    "~^POST:/api/registro/?$" $binary_remote_addr;
}
map "$request_method:$uri" $envivo_lim_pago {
    default "";
    "~^POST:/api/plux/pago/?$" $binary_remote_addr;
}
map "$request_method:$uri" $envivo_lim_chat {
    default "";
    "~^POST:/api/chat/?$" $binary_remote_addr;
}

# Reportes de errores del juego y eventos (si el servidor los tiene): POST /api/error, /api/errores, /api/eventos
map "$request_method:$uri" $envivo_lim_error {
    default "";
    "~^POST:/api/(error|errores)/?$" $binary_remote_addr;
}
map "$request_method:$uri" $envivo_lim_eventos {
    default "";
    "~^POST:/api/eventos/?$" $binary_remote_addr;
}
# Tope GENERAL de /api/ (GET y POST), solo contra inundaciones: muy alto a proposito (CGNAT: muchos celulares con la
# misma IP). No cuenta lo que sale del mismo VPS (127.0.0.1: chequeo de salud y prueba de carga hecha en el servidor).
# Detras de Cloudflare $remote_addr ya es la IP real del jugador (real_ip_header), asi que 127.0.0.1 es solo lo local.
geo $envivo_ip_local {
    default 0;
    127.0.0.1 1;
    ::1 1;
}
map $envivo_ip_local $envivo_lim_api {
    default $binary_remote_addr;
    1 "";
}

# Entrar: 20 por minuto por IP (+15 de golpe). Registro: 6 por minuto (+10). Pago con tarjeta: 12 por minuto (+10).
# Escribir en el chat: 30 por minuto (+15). Leer el chat (GET cada 3 s) NO se limita aqui (solo el tope general).
# Errores: 30 por minuto (+20). Eventos: 60 por minuto (+30). Todo /api/: 20 por segundo por IP (+200 de golpe).
limit_req_zone $envivo_lim_entrar   zone=envivo_entrar:10m   rate=20r/m;
limit_req_zone $envivo_lim_registro zone=envivo_registro:10m rate=6r/m;
limit_req_zone $envivo_lim_pago     zone=envivo_pago:10m     rate=12r/m;
limit_req_zone $envivo_lim_chat     zone=envivo_chat:10m     rate=30r/m;
limit_req_zone $envivo_lim_error    zone=envivo_error:10m    rate=30r/m;
limit_req_zone $envivo_lim_eventos  zone=envivo_eventos:10m  rate=60r/m;
limit_req_zone $envivo_lim_api      zone=envivo_api:20m      rate=20r/s;
