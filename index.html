<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>EN VIVO Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EN VIVO">
<script src="js/pwa.js"></script>
<!-- /PWA -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --panel:#161a22; --panel2:#1e2430; --line:#2a3242;
    --text:#e9edf5; --muted:#8b95a8; --red:#ff3b3b; --amber:#ffb020; --green:#2ecc71; --blue:#4da3ff;
    --radius:14px;
    color-scheme:dark;
    /* Fuentes: si una letra no está en la fuente del juego (chino, ruso, árabe…), se usa la del sistema */
    --f-body:"IBM Plex Sans","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Noto Sans Arabic",Tahoma,sans-serif;
    --f-head:"Barlow Condensed","Roboto Condensed","Arial Narrow",var(--f-body);
    --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono",monospace,var(--f-body);
  }
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer}
  .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:var(--f-head);letter-spacing:.5px;margin:0}

  /* Barra superior */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 80%,#0d0f1400);padding-block:10px 12px}
  .brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:800;font-size:20px;text-transform:uppercase}
  .tally{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  .stats{display:flex;gap:8px;margin-top:8px}
  .chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center}
  .chip small{display:block;color:var(--muted);font-size:11px}
  .chip b{font-family:var(--f-mono);font-size:15px}
  .neg{color:var(--red)}

  main{max-width:640px;margin:0 auto;padding-block:0}
  section{display:none}
  section.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:22px;margin-bottom:6px}
  .card h3{font-size:18px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;margin-block:3px 0;margin-inline:0 4px}
  .tag.red{border-color:#ff3b3b66;color:#ffb3b3}
  .tag.amber{border-color:#ffb02066;color:#ffd78a}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);margin-top:8px;text-align:center}
  .btn.main{background:var(--red);border-color:var(--red);color:#fff}
  .btn.green{background:var(--green);border-color:var(--green);color:#06210f}
  .btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:0}
  .btn:disabled{opacity:.4}
  .btn:active:not(:disabled){transform:scale(.98)}
  .sectitle{font-family:var(--f-head);font-size:15px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin:18px 0 8px}
  .bar{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar.amber i{background:var(--amber)}
  .bar.red i{background:var(--red)}
  .pay{font-family:var(--f-mono);color:var(--green);font-size:18px}
  .icon{font-size:26px;width:40px;text-align:center}
  .grow{flex:1;min-width:0}
  .log p{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log p span{color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-inline-end:6px}

  /* Navegación inferior */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:#11141bf2;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
  nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;color:var(--muted)}
  nav button span{display:block;font-size:21px;margin-bottom:2px}
  nav button.on{color:var(--text)}
  nav button.on span{filter:drop-shadow(0 0 6px #ff3b3b99)}
  .badge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-inline-start:2px}

  /* Ventanas */
  .overlay{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  /* Con una ventana abierta, la barra de arriba (dinero, fama, créditos, día) queda encima para ver cuánto tienes al comprar */
  body:has(#overlay.on) header{z-index:22}
  body:has(#overlay.on) .overlay .modal{max-height:calc(100vh - var(--hdr-h, 120px) - 6px);max-height:calc(100dvh - var(--hdr-h, 120px) - 6px)}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .modal h2{font-size:24px;margin-bottom:8px}
  .live{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:800;font-family:var(--f-head);padding:3px 10px;border-radius:6px;letter-spacing:1px}
  .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  .incident{font-size:18px;line-height:1.4;margin:14px 0}
  .choice{text-align:start}
  .choice small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .delta{font-family:var(--f-mono);font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)}
  .stars{font-size:34px;letter-spacing:4px;text-align:center;margin:8px 0}
  .pick{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel2)}
  .pick.sel{border-color:var(--red);background:#2a1a1f}
  .pick input{width:20px;height:20px;accent-color:var(--red)}
  .preview{position:sticky;bottom:-18px;background:var(--panel);padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:2px;padding:12px 0;min-height:40px;line-height:1.3}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:4px 0;border-bottom:1px solid var(--line)}
  td:last-child{text-align:end;font-family:var(--f-mono)}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;background:#000e;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;display:none}
  .story{font-size:16px;line-height:1.5}
  .story-tag{color:var(--amber);font-family:var(--f-head);text-transform:uppercase;letter-spacing:1px}
  .card.temp-card{border-color:#ffd27a55;background:linear-gradient(160deg,#ffd27a14,transparent 60%),var(--panel)}
  .temp-card h2{margin:4px 0}.temp-card .btn{margin-top:8px}.temp-prox{padding:10px 12px}
  .paylater.ext{border-color:#ffd27a66;color:var(--amber)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.tally,.live i{animation:none}}

  /* ---- Gráficos ---- */
  .ico{width:22px;height:22px;flex:none;vertical-align:middle}
  .ico.sm{width:15px;height:15px;margin-top:-2px}
  .ico.lg{width:28px;height:28px}
  nav button span{display:flex;justify-content:center;margin-bottom:3px;font-size:0}
  nav button span .ico{width:23px;height:23px}
  nav button.on span{color:var(--red);filter:none}
  .tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .tile.t-red{background:#3a1519;border-color:#5a2026;color:#ff8f8f}
  .tile.t-amber{background:#3a2a0d;border-color:#5a4214;color:#ffcf6e}
  .tile.t-blue{background:#0f2440;border-color:#1c3d66;color:#8cc4ff}
  .tile.t-green{background:#0e2e1d;border-color:#1a4d31;color:#7fe0a8}
  .tag .ico{width:13px;height:13px;margin-block:-2px 0;margin-inline:0 3px}
  .tag.rival{border-color:#ff3b3b;background:#3a1519;color:#ffb3b3;font-weight:600}
  .btn .ico{margin-block:-3px 0;margin-inline:0 6px}
  .chip small{display:flex;justify-content:center;align-items:center;gap:4px}
  .chip small .ico{width:12px;height:12px}
  .hq,.scene{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#0d0f14}
  .hqcard{padding:0;overflow:hidden}
  .hqcard .hq{border:0;border-radius:0}
  .hqcard .in{padding:12px 14px 14px}
  .speaker{display:flex;gap:12px;align-items:center;margin-bottom:8px}
  .speaker .who{font-family:var(--f-head);font-size:14px;color:var(--amber);text-transform:uppercase;letter-spacing:1px}
  .portrait{flex:none;display:block}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:12px 14px}
  .starsvg{display:flex;justify-content:center;gap:6px;margin:10px 0}
  .starsvg svg{width:38px;height:38px}
  .starsvg .on{fill:var(--amber);stroke:var(--amber);animation:pop .45s backwards}
  .starsvg .off{fill:none;stroke:var(--line)}
  @keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1)}}
  .iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:36px;height:32px;display:grid;place-items:center;margin-inline-start:auto;flex:none}
  .langbtn{width:auto;display:flex;align-items:center;gap:4px;padding:0 8px;margin-inline-start:6px;font-family:var(--f-body);font-size:12px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--muted)}
  .langbtn .ico{width:15px;height:15px;margin:0}
  .langlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px}
  .langlist .btn{overflow-wrap:anywhere}
  /* Animaciones de las escenas */
  .blink{animation:blink 1.1s infinite}
  .bulb{animation:glow 2.4s infinite}
  @keyframes glow{50%{opacity:.5}}
  .crowd{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box}
  @keyframes bob{50%{transform:translateY(-2px)}}
  .beam{animation:sway 3s ease-in-out infinite;transform-origin:top center;transform-box:fill-box}
  @keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  @keyframes rain{from{transform:translate(0,-20px)}to{transform:translate(-8px,30px)}}
  .fx-dark{animation:dark 2.2s infinite}
  /* Apagón: se anima la opacidad (la compone la GPU), no fill-opacity (repinta el SVG) */
  @keyframes dark{0%,100%{opacity:.96}8%{opacity:.27}12%{opacity:.96}40%{opacity:1}}
  .fx-spark{animation:spark .35s steps(2) infinite}
  @keyframes spark{50%{opacity:.2}}
  .fx-blink{animation:blink .8s infinite}
  .fx-wave circle{animation:wave 1s ease-out infinite;transform-origin:180px 90px}
  @keyframes wave{from{transform:scale(.4);opacity:1}to{transform:scale(1.3);opacity:0}}
  .fx-flash{animation:flash 1.6s ease-out 1}
  @keyframes flash{0%{opacity:.85}100%{opacity:0}}
  .fx-confetti{animation:fall 2.2s linear infinite}
  @keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(190px) rotate(300deg)}}
  .fx-glitch{animation:glitch .25s steps(3) infinite}
  @keyframes glitch{0%{transform:translateX(0)}33%{transform:translateX(-4px)}66%{transform:translateX(3px)}}
  .cam-off{opacity:.35}
  @media (prefers-reduced-motion:reduce){.blink,.bulb,.crowd,.beam,.fx-rain path,.fx-dark,.fx-spark,.fx-blink,.fx-wave circle,.fx-confetti,.fx-glitch,.starsvg .on{animation:none}.fx-flash{display:none}}

  /* ---- Tienda ---- */
  nav button{font-size:10.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:1px}
  nav button em{font-style:normal}
  /* El contador va sobre el ícono: así no le quita espacio al nombre de la pestaña (idiomas largos) */
  nav button{position:relative}
  nav .badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);margin:0;line-height:15px;min-width:15px}
  .badge:empty{display:none}
  .vipbadge{font-family:var(--f-head);font-size:12px;font-weight:800;letter-spacing:1px;color:#1a1205;background:var(--amber);border-radius:6px;padding:1px 7px}
  .wallet{display:flex;align-items:center;gap:12px}
  .wallet .big{font-family:var(--f-mono);font-size:28px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
  .wallet .ico{color:var(--amber);width:30px;height:30px}
  .prod{position:relative}
  .prod.dest{border-color:var(--amber);background:linear-gradient(160deg,#2a2210,var(--panel) 60%)}
  .ribbon{position:absolute;top:-9px;inset-inline-end:12px;background:var(--amber);color:#1a1205;font-weight:800;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:6px;font-family:var(--f-head)}
  .price{font-family:var(--f-mono);font-size:20px;color:var(--text);font-variant-numeric:tabular-nums}
  .cr{font-family:var(--f-mono);color:var(--amber);font-variant-numeric:tabular-nums}
  .field{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:13px;color:var(--muted)}
  .field input{font:inherit;font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  .field input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  .legal{display:flex;gap:14px;justify-content:center;font-size:12px;margin:14px 0 22px}
  .legal a{color:var(--muted)}
  /* Tienda v2: secciones (pase, VIP, estrellas, obra, créditos), contenido a la vista y precio real */
  .tv-sec{scroll-margin-top:124px}
  .tv-sec .sectitle .ico{width:16px;height:16px;flex:none}
  .tv-nav{margin-top:2px}
  .tv-nav .catchip .ico{color:var(--amber)}
  .tv-trust{display:flex;gap:10px;align-items:flex-start;background:#2ecc710f;border:1px solid #2ecc7140;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin:2px 0 10px}
  .tv-trust .ico{flex:none;width:18px;height:18px;color:var(--green);margin-top:1px}
  .tv-trust span{min-width:0;overflow-wrap:anywhere}
  .tv-prod{position:relative}
  .tv-prod h3,.tv-vipcard h3,.tv-comp h3{font-size:18px;line-height:1.15;overflow-wrap:anywhere}
  .tv-head{display:flex;align-items:center;gap:12px;min-width:0}
  .tv-head .itemart,.tv-head .btn{flex:none}
  .tv-inc{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
  .tv-inc li{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.35;min-width:0}
  .tv-inc li span{min-width:0;overflow-wrap:anywhere}
  .tv-inc li .ico{flex:none;width:15px;height:15px;margin-top:2px;color:var(--green)}
  .tv-inc li.amber{color:#ffd78a}
  .tv-inc li.amber .ico{color:var(--amber)}
  .tv-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
  .tv-foot .btn.sm{padding:10px 18px;font-size:14px;margin-inline-start:auto}
  .tv-nota{margin:6px 0 0}
  .price.sm{font-size:15px}
  .tv-badge{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;position:relative;color:var(--amber);background:linear-gradient(160deg,#ffb02026,#ffb02008);border:1px solid #ffb02055}
  .tv-badge .ico{width:26px;height:26px;margin:0}
  .tv-badge b{position:absolute;inset-inline-end:-6px;bottom:-6px;min-width:22px;height:22px;border-radius:7px;background:var(--amber);color:#1a1205;font-family:var(--f-head);font-size:14px;display:grid;place-items:center;padding:0 4px}
  .tv-badge.t-red{color:var(--red);background:linear-gradient(160deg,#ff3b3b26,#ff3b3b08);border-color:#ff3b3b55}
  .tv-badge.t-plus{color:#b57bff;background:linear-gradient(160deg,#b57bff2e,#b57bff08);border-color:#b57bff66}
  .tv-pase{border-color:#ffb02044}
  .tv-hero{border-color:#ffb02066;background:linear-gradient(160deg,#2a2210,var(--panel) 62%)}
  .tv-mats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
  .tv-mat{display:flex;gap:6px;align-items:baseline;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;line-height:1.25;min-width:0}
  .tv-mat span{min-width:0;overflow-wrap:anywhere;color:var(--muted)}
  .tv-mat b{flex:none;font-size:13px;color:var(--text)}
  .tv-mat.rare{border-color:#b57bff66;background:#21173a}
  .tv-mat.rare b{color:#d7b8ff}
  .tv-cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .tv-cred{margin:0;padding:12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
  .tv-cred .grow2{flex:1}
  .tv-cn{font-size:24px;font-weight:600;color:var(--amber);line-height:1.1;margin-top:2px}
  .tv-cd{margin-top:4px;line-height:1.3;overflow-wrap:anywhere}
  .tv-bono{margin-top:6px;font-size:12px;line-height:1.3;color:#ffd78a;background:#ffb02014;border:1px solid #ffb02055;border-radius:8px;padding:3px 6px;overflow-wrap:anywhere}
  .tv-cred .tv-foot{flex-direction:column;align-items:stretch;width:100%;gap:6px;margin-top:10px}
  .tv-cred .tv-foot .price{text-align:center}
  .tv-cred .tv-foot .btn.sm{width:100%;margin:0}
  .tv-vipcard{--vc:#ffd34d;border-color:color-mix(in srgb,var(--vc) 45%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,var(--vc) 13%,var(--panel)),var(--panel) 65%)}
  .tv-medal{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--vc);border:2px solid var(--vc);background:color-mix(in srgb,var(--vc) 14%,transparent);position:relative}
  .tv-medal .ico{width:24px;height:24px;margin:0}
  .tv-medal b{position:absolute;inset-inline-end:-5px;bottom:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--vc);color:#14161c;font-size:12px;display:grid;place-items:center;padding:0 4px}
  .tv-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .tv-bar{height:8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:12px 0 0}
  .tv-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vc),color-mix(in srgb,var(--vc) 55%,#fff));border-radius:6px}
  .tv-of{border-color:#ffb02066;background:linear-gradient(160deg,#2a2210,var(--panel) 60%)}
  .tv-row{display:flex;gap:12px;align-items:flex-start;min-width:0}
  .tv-row + .tv-row{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

  /* ---- Pulido visual (rarezas, equipos, avatares, transiciones) ---- */
  html{overflow-x:hidden} body{overflow-x:clip}   /* en body "clip" y no "hidden": hidden rompe la barra fija de arriba (position:sticky) */

  svg{direction:ltr}
  [dir=rtl] .speaker .who,[dir=rtl] .sectitle,[dir=rtl] .story-tag,[dir=rtl] .rtag{letter-spacing:0}
  header{background:linear-gradient(var(--bg) 78%,#0d0f1400)}
  .chip{display:flex;align-items:center;gap:8px;text-align:start;padding:6px 9px;background:linear-gradient(180deg,#1b2029,#151920);position:relative;overflow:hidden;min-width:0}

  .chip .ci .ico{width:16px;height:16px}
  .chip.c-money .ci{background:#0e2e1d;color:#7fe0a8}
  .chip.c-fame .ci{background:#3a2a0d;color:#ffcf6e}
  .chip.c-day .ci{background:#0f2440;color:#8cc4ff}
  .chip.c-gem .ci{background:#2a1540;color:#d4a5ff}
  .chip.c-gem{flex:.95;cursor:pointer}
  .chip.c-gem[hidden]{display:none}
  /* Con 4 recuadros (dinero, fama, créditos, día) en un celular: sin íconos para que quepan los números */
  @media (max-width:520px){
    .stats.con-gem{gap:5px}
    .stats.con-gem .chip{padding:6px 7px;gap:0}

    .stats.con-gem .chip b{font-size:15px}
    .stats.con-gem .chip.c-money{flex:1.3}.stats.con-gem .chip.c-fame{flex:.8}.stats.con-gem .chip.c-gem{flex:1.05}.stats.con-gem .chip.c-day{flex:.7}
  }
  .chip .cv{min-width:0;line-height:1.1}
  .chip.c-money{flex:1.45}
  .chip.c-day{flex:.8}
  @media (max-width:380px){.chip{gap:6px;padding:6px 7px}.chip .ci{width:22px;height:22px;border-radius:7px}.chip .ci .ico{width:14px;height:14px}.chip b{font-size:13.5px}}
  .chip small{display:block;justify-content:flex-start;font-size:10.5px;letter-spacing:.3px}
  .chip b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.bump b{animation:bump .5s ease-out}
  @keyframes bump{30%{transform:scale(1.12);color:var(--green)}}
  .chip.bump.bump-down b{animation-name:bumpd}
  @keyframes bumpd{30%{transform:scale(1.08);color:var(--red)}}
  section.enter{animation:tabin .2s ease-out}
  @keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .overlay.on .modal{animation:sheet .22s ease-out}
  @keyframes sheet{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
  .btn{transition:transform .08s,filter .08s}
  .btn:active:not(:disabled){transform:scale(.97);filter:brightness(1.12)}
  .btn.main{background:linear-gradient(180deg,#ff5252,#e02a2a);box-shadow:inset 0 1px 0 #ffffff40}
  .btn.green{background:linear-gradient(180deg,#3fdc82,#25b862);box-shadow:inset 0 1px 0 #ffffff50}
  .pick,.gear,.prodcard{transition:transform .08s}
  .pick:active,.gear:active{transform:scale(.985)}
  .card{background:linear-gradient(180deg,#191e27,var(--panel) 40%)}
  .sectitle{display:flex;align-items:center;gap:8px}
  .sectitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:20px 14px;color:var(--muted)}
  .empty .ei{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--panel2);border:1px dashed var(--line);color:var(--muted)}
  .empty .ei .ico{width:26px;height:26px}
  .empty b{color:var(--text);font-family:var(--f-head);font-size:18px;letter-spacing:.4px}

  /* Rarezas */
  .rf{--rc:#9aa6bb;--rbg:#1b2029;position:relative;overflow:hidden;border-color:#3a4252;background:linear-gradient(180deg,var(--rbg),var(--panel) 62%)}
  .rf::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--rc);opacity:.85}
  .rf.r-pro{--rc:#4da3ff;--rbg:#132338;border-color:#24466e}
  .rf.r-elite{--rc:#b57bff;--rbg:#21173a;border-color:#4a3378}
  .rf.r-exclusivo{--rc:#ff8a3d;--rbg:#33200f;border-color:#7a4520;box-shadow:0 0 0 1px #ff8a3d33,0 6px 18px -8px #ff8a3d80}
  .rf.r-vip{--rc:#ffd34d;--rbg:#332a0c;border-color:#8a6f1c;box-shadow:0 0 0 1px #ffd34d40,0 6px 20px -8px #ffd34d99}
  .rf.r-vip::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,#fff3c440,transparent);transform:skewX(-18deg);animation:shimmer 2.8s ease-in-out infinite;pointer-events:none}
  @keyframes shimmer{0%{transform:translateX(0) skewX(-18deg)}60%,100%{transform:translateX(420%) skewX(-18deg)}}
  /* Edición Exclusiva (créditos): tarjeta dorada a todo el ancho, arriba de cada categoría de la Tienda de equipos */
  .gear.exq{grid-column:1/-1;--rc:#f0b829;--rbg:#2c2410;border-color:#b8902a;background:linear-gradient(155deg,#33290f 0%,#1d1a12 42%,var(--panel) 100%);box-shadow:0 0 0 1px #f0b82959,0 10px 26px -12px #f0b829b3}
  .gear.exq::before{height:3px;background:linear-gradient(90deg,#a77a12,#ffe9a3,#f0b829,#a77a12);opacity:1}
  .gear.exq::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#fff3c42e,transparent);transform:skewX(-18deg);animation:shimmer 3.4s ease-in-out infinite;pointer-events:none}
  .gear.exq.r-vip{--rbg:#332a0c}
  .exq-top{display:flex;align-items:center;justify-content:space-between;gap:6px;position:relative;z-index:1}
  .exb{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-head);font-weight:800;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:#1a1205;background:linear-gradient(90deg,#f0b829,#fff1b8 55%,#f0b829);border:1px solid #f0b829;border-radius:6px;padding:0 7px;line-height:18px;white-space:nowrap}
  .exb{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .exb .ico{width:12px;height:12px}
  .exb.vip{background:linear-gradient(90deg,#ffd34d,#fff7d6,#ffd34d)}
  .exq-body{display:grid;grid-template-columns:minmax(92px,36%) minmax(0,1fr);gap:10px;align-items:center;margin-top:4px}
  .exq-body .art{margin:0}
  .exq .nm{margin-top:0;font-size:15px;color:#fff3c4}
  .exq .ds{-webkit-line-clamp:3}
  .exq-perks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
  .exq-perks li{display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:1.25;color:#ffe08a;background:#f0b8291a;border:1px solid #f0b82966;border-radius:999px;padding:1px 7px}
  .exq-perks li .ico{width:11px;height:11px}
  .exq-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .exq-btns .btn:only-child{grid-column:1/-1}
  .gear .btn.ex-cred{background:linear-gradient(180deg,#ffd86a,#f0b829);color:#1a1205;border-color:#f7c948;font-weight:800;font-family:var(--f-mono);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .gear .btn.ex-cred[disabled]{background:#3a3220;color:#cdbb8a;border-color:#5a4a22;font-family:inherit;font-size:12.5px}
  .gear .btn.ex-free{font-size:12px}
  .exq .ex-nota{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.3}
  .gear.exq-mia{--rc:#f0b829;border-color:#b8902a;box-shadow:0 0 0 1px #f0b82940}
  .rtag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-head);font-weight:800;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--rc,#9aa6bb);background:#0d0f14b3;border:1px solid currentColor;border-radius:6px;padding:0 6px;line-height:17px}
  .rtag::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor;transform:rotate(45deg)}
  .rf.r-vip .rtag{background:linear-gradient(90deg,#ffd34d,#fff1b8,#f0b829);color:#1a1205;border-color:#f0b829}
  .rf.r-vip .rtag::before{background:#1a1205}

  /* Tarjetas de equipo */
  .ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .gear{padding:10px;margin:0;display:flex;flex-direction:column;min-width:0}
  .gear .art{display:flex;justify-content:center;margin:2px 0 4px;position:relative}
  .gear .art .itemart{width:100%;max-width:120px;height:auto}
  .gear .nm{font-weight:700;font-size:14px;line-height:1.2;margin-top:6px;overflow-wrap:anywhere}
  .gear .ds{font-size:12px;color:var(--muted);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .gear .grow2{flex:1}
  .gear .btn{width:100%;margin-top:8px;padding:9px 6px;font-size:13px}
  .gear .btn.sm{display:block}
  .gear .owned{position:absolute;top:0;inset-inline-end:0;font-family:var(--f-mono);font-size:11px;background:#0d0f14cc;border:1px solid var(--line);border-radius:6px;padding:1px 5px}

  .mini{flex:none;display:block}
  .pick .mini{width:44px;height:44px}

  /* Avatares */
  .avatar{flex:none;display:block}
  .person{display:flex;align-items:center;gap:12px}
  .person .who{min-width:0}
  /* Nombres largos: bajan a una segunda línea (QA-16) */
  .person h3{white-space:normal;overflow:hidden;overflow-wrap:anywhere;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .skill{color:var(--amber);letter-spacing:1px;font-size:13px}
  .badge-p{font-family:var(--f-head);font-size:11px;font-weight:800;letter-spacing:.6px;color:#1a1205;background:linear-gradient(90deg,#ffd34d,#f0b829);border-radius:5px;padding:0 5px;margin-inline-start:4px;vertical-align:2px}

  /* Inicio: gastos del local */
  .costbox{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:10px}
  .costbox .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#3a2a0d;color:#ffcf6e;flex:none}
  .costbox .t{font-size:13px;line-height:1.35;min-width:0}
  .costbox .t b{font-family:var(--f-mono)}

  /* Duelo con MegaVisión */
  .duel{margin-top:8px;background:#1f1418;border:1px solid #5a2026;border-radius:10px;padding:8px 10px}
  .duel .lbl{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
  .duel .bar{height:8px;margin-top:3px}
  .duel .bar.you i{background:linear-gradient(90deg,#25b862,#3fdc82)}
  .duel .bar.mega i{background:linear-gradient(90deg,#a5161c,#ff3b3b)}
  .duel.won{border-color:#1a4d31;background:#0f2118}
  .duel .res{font-family:var(--f-head);font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-size:15px}

  /* Resultado */
  .result-head{text-align:center}
  .result-head h2{font-size:28px}

  .bigmoney.up{color:var(--green)} .bigmoney.down{color:var(--red)}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .confetti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:cf var(--d,1.8s) cubic-bezier(.2,.6,.4,1) forwards;animation-delay:var(--w,0s)}
  @keyframes cf{0%{transform:translate3d(0,0,0) rotate(0);opacity:1}100%{transform:translate3d(var(--x,0),var(--y,90vh),0) rotate(var(--r,540deg));opacity:0}}

  /* Tienda */
  .showcase{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
  .prod .art{display:flex;justify-content:center}
  .prodrow{display:flex;align-items:center;gap:12px}

  .prod-nom-btn{flex:none;margin:0}
  .pls{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px}
  .pl-cab{width:100%;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left;color:var(--text);font:inherit;cursor:pointer;min-height:54px}
  .pl-ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--amber)}
  .pl-ic .ico{margin:0}
  .pl-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

  .pl-fl{flex:none;color:var(--muted);font-size:24px;line-height:1;transition:transform .2s}

  .pl-amber .pl-cab{border-color:#5a4214}
  .pl-amber .pl-ic{background:#3a2a0d}
  @media (prefers-reduced-motion:reduce){.pl-fl{transition:none}}
  .ac-hq{border-radius:12px;overflow:hidden;margin-top:6px}

  /* Escenas */
  .hover{animation:hover 2.4s ease-in-out infinite}

  .spin{animation:spin .3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .twinkle{animation:tw 1.8s ease-in-out infinite}
  @keyframes tw{50%{opacity:.25}}
  .rays{animation:spin 24s linear infinite}
  .pulse{animation:glow 2s ease-in-out infinite}
  .flicker{animation:flick 1.3s steps(3) infinite}
  @keyframes flick{50%{opacity:.7}}
  .puff{animation:puff 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes puff{from{transform:scale(.5);opacity:.5}to{transform:translateY(-8px) scale(1.6);opacity:0}}
  .cloud{animation:drift 14s ease-in-out infinite alternate}
  @keyframes drift{to{transform:translateX(18px)}}
  .jib{animation:jib 5s ease-in-out infinite}
  @keyframes jib{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
  .fx-rain{animation:rain .45s linear infinite}
  .fx-rain-far{animation-duration:.7s}
  .fx-rain-near{animation-duration:.32s}
  .ripple{animation:ripple 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1.4);opacity:0}}
  .fx-pop{animation:popin .5s ease-out backwards;transform-box:fill-box;transform-origin:center}
  @keyframes popin{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .sb-t{animation:sbt 600s steps(6) infinite}
  .sb-u{animation:sbu 60s steps(10) infinite}
  @keyframes sbt{to{transform:translateY(-60px)}}
  @keyframes sbu{to{transform:translateY(-100px)}}
  .scene{box-shadow:0 8px 24px -12px #000}

  @media (prefers-reduced-motion:reduce){
    section.enter,.overlay.on .modal,.chip.bump b,.rf.r-vip::after,.gear.exq::after,.hover,.spin,.twinkle,.rays,.pulse,.flicker,.puff,.cloud,.jib,.fx-rain,.ripple,.fx-pop,.sb-t,.sb-u{animation:none}
    .confetti{display:none}
    .btn,.pick,.gear{transition:none}
  }

  /* ---- Integración: música, soporte, plan del evento, avisos ---- */
  .iconbtn + .iconbtn:not(.langbtn){margin-inline-start:6px}
  .iconbtn[hidden]{display:none}
  @media (max-width:380px){.brand{font-size:18px;gap:6px}.iconbtn{width:32px}.iconbtn + .iconbtn:not(.langbtn){margin-inline-start:5px}.langbtn{margin-inline-start:5px;padding:0 6px}}
  .iconbtn[aria-pressed="true"]{color:var(--amber)}
  .redstrip{display:flex;align-items:center;gap:8px;background:#3a1519;border:1px solid #ff3b3b;color:#ffd0d0;border-radius:12px;padding:10px 12px;margin:2px 0 12px;font-size:13.5px;font-weight:600}
  .redstrip .ico{color:var(--red);flex:none}

  .redstrip.amberstrip{background:#2a2210;border-color:#5a4214;color:#ffd78a}

  .card .pe-intl{margin-top:8px}
  .modal .pe-intl{margin:8px 0 4px}
  .modal .pe-risk{justify-content:center}
  tr.caja td{border-top:1px solid var(--muted)}
  /* Con el botón flotante del chat, que el último botón de cada pestaña no quede debajo */
  body:has(#chat-btn) main{padding-bottom:64px}
  /* Rendimiento: parpadeos en dos pasos, nada animado detrás de una ventana abierta, tarjetas fuera de pantalla sin pintar */
  .blink,.fx-blink,.tally,.live i{animation-timing-function:steps(1,end)}
  body:has(#overlay.on) main *,body:has(#overlay.on) header *{animation-play-state:paused}
  .gear{content-visibility:auto;contain-intrinsic-size:auto 230px}

  /* ---- v6: tienda por categorías, niveles del personal, rango de calidad, avisos del día, en línea ---- */
  .catrow{position:relative;display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px 4px;scroll-padding:16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent)}

  .catwrap{position:relative}
  .catflecha{position:absolute;top:calc(50% - 5px);transform:translateY(-50%);z-index:3;width:34px;height:34px;padding:0;border-radius:50%;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #000a;cursor:pointer}
  .catflecha.izq{left:-10px}.catflecha.der{right:-10px}
  .catflecha[hidden]{display:none}
  .catflecha:hover{border-color:var(--amber);color:var(--amber)}
  .catchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 11px 7px 9px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}

  .onl-tile:disabled{opacity:.5}

  .onl-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}

  .card .btn.sm + .btn.sm{margin-inline-start:6px}
</style>
</head>
