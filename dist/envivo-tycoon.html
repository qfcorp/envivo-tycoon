<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>EN VIVO Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --panel:#161a22; --panel2:#1e2430; --line:#2a3242;
    --text:#e9edf5; --muted:#8b95a8; --red:#ff3b3b; --amber:#ffb020; --green:#2ecc71; --blue:#4da3ff;
    --radius:14px;
    color-scheme:dark;
  }
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  button{font:inherit;color:inherit;cursor:pointer}
  .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.5px;margin:0}

  /* Barra superior */
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 80%,#0d0f1400);padding-block:10px 12px}
  .brand{display:flex;align-items:center;gap:8px;font-family:"Barlow Condensed";font-weight:800;font-size:20px;text-transform:uppercase}
  .tally{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.35}}
  .stats{display:flex;gap:8px;margin-top:8px}
  .chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center}
  .chip small{display:block;color:var(--muted);font-size:11px}
  .chip b{font-family:"JetBrains Mono";font-size:15px}
  .neg{color:var(--red)}

  main{max-width:640px;margin:0 auto;padding-block:0}
  section{display:none}
  section.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h2{font-size:22px;margin-bottom:6px}
  .card h3{font-size:18px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;margin:3px 4px 0 0}
  .tag.red{border-color:#ff3b3b66;color:#ffb3b3}
  .tag.amber{border-color:#ffb02066;color:#ffd78a}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);margin-top:8px;text-align:center}
  .btn.main{background:var(--red);border-color:var(--red);color:#fff}
  .btn.green{background:var(--green);border-color:var(--green);color:#06210f}
  .btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:0}
  .btn:disabled{opacity:.4}
  .btn:active:not(:disabled){transform:scale(.98)}
  .sectitle{font-family:"Barlow Condensed";font-size:15px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;margin:18px 0 8px}
  .bar{height:7px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--green)}
  .bar.amber i{background:var(--amber)}
  .bar.red i{background:var(--red)}
  .pay{font-family:"JetBrains Mono";color:var(--green);font-size:18px}
  .icon{font-size:26px;width:40px;text-align:center}
  .grow{flex:1;min-width:0}
  .log p{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log p span{color:var(--muted);font-family:"JetBrains Mono";font-size:11px;margin-right:6px}

  /* Navegación inferior */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:6;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);background:#11141bf2;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
  nav button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;color:var(--muted)}
  nav button span{display:block;font-size:21px;margin-bottom:2px}
  nav button.on{color:var(--text)}
  nav button.on span{filter:drop-shadow(0 0 6px #ff3b3b99)}
  .badge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:2px}

  /* Ventanas */
  .overlay{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:flex-end;justify-content:center}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .modal h2{font-size:24px;margin-bottom:8px}
  .live{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;font-weight:800;font-family:"Barlow Condensed";padding:3px 10px;border-radius:6px;letter-spacing:1px}
  .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  .incident{font-size:18px;line-height:1.4;margin:14px 0}
  .choice{text-align:left}
  .choice small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
  .delta{font-family:"JetBrains Mono";font-weight:700}
  .up{color:var(--green)} .down{color:var(--red)}
  .stars{font-size:34px;letter-spacing:4px;text-align:center;margin:8px 0}
  .pick{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel2)}
  .pick.sel{border-color:var(--red);background:#2a1a1f}
  .pick input{width:20px;height:20px;accent-color:var(--red)}
  .preview{position:sticky;bottom:-18px;background:var(--panel);padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:4px 0;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;font-family:"JetBrains Mono"}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;background:#000e;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;display:none}
  .story{font-size:16px;line-height:1.5}
  .story-tag{color:var(--amber);font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:1px}
  button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){.tally,.live i{animation:none}}
</style>
</head>
<body>
<header class="gut">
  <div class="brand"><span class="tally"></span> En Vivo Tycoon</div>
  <div class="stats">
    <div class="chip"><small>Dinero</small><b id="hMoney">$0</b></div>
    <div class="chip"><small>Fama</small><b id="hRep">0</b></div>
    <div class="chip"><small>Día</small><b id="hDay">1</b></div>
  </div>
</header>

<main class="gut">
  <section id="tab-inicio" class="on"></section>
  <section id="tab-clientes"></section>
  <section id="tab-personal"></section>
  <section id="tab-bodega"></section>
  <section id="tab-registro"></section>
</main>

<nav>
  <button data-tab="inicio" class="on"><span>🏠</span>Inicio</button>
  <button data-tab="clientes"><span>📋</span>Clientes <b class="badge" id="badgeC"></b></button>
  <button data-tab="personal"><span>👥</span>Personal</button>
  <button data-tab="bodega"><span>📦</span>Bodega</button>
  <button data-tab="registro"><span>📜</span>Registro</button>
</nav>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   EN VIVO Tycoon — Lógica del juego
   Este archivo NO toca la pantalla. Solo reglas y datos.
   Se puede probar con Node:  node tests/test_logic.js
   ========================================================= */
(function (root) {
  'use strict';

  const SAVE_VERSION = 1;

  /* ---------- Números aleatorios (con semilla, para poder probar) ---------- */
  function rnd(s) {
    s.seed = (s.seed + 0x6D2B79F5) | 0;
    let t = s.seed;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const randInt = (s, a, b) => a + Math.floor(rnd(s) * (b - a + 1));
  const pick = (s, arr) => arr[Math.floor(rnd(s) * arr.length)];
  const chance = (s, p) => rnd(s) < p;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const money = (n) => '$' + Math.round(n).toLocaleString('es-EC');

  /* ---------- Datos ---------- */
  const ROLES = {
    cam: { name: 'Camarógrafo', icon: '🎥' },
    dir: { name: 'Director / vMix', icon: '🎬' },
    audio: { name: 'Sonidista', icon: '🎧' },
    stream: { name: 'Técnico de streaming', icon: '📡' },
  };

  const CATALOG = {
    cam_basic:    { name: 'Cámara básica',              icon: '📹', cat: 'cam',      price: 600,  q: 1, minRep: 0,  desc: 'Camcorder sencilla. Sirve para empezar.' },
    cam_pro:      { name: 'Cámara profesional',         icon: '🎥', cat: 'cam',      price: 1800, q: 2, minRep: 10, desc: 'Mejor imagen y zoom. Los clientes lo notan.' },
    cam_cine:     { name: 'Cámara broadcast 4K',        icon: '🎞️', cat: 'cam',      price: 4500, q: 3, minRep: 35, desc: 'Calidad de televisión. Para eventos grandes.' },
    switch_basic: { name: 'Laptop con vMix',            icon: '💻', cat: 'switcher', price: 900,  q: 1, minRep: 0,  desc: 'Mezcla varias cámaras y transmite.' },
    switch_pro:   { name: 'Switcher ATEM + PC potente', icon: '🎛️', cat: 'switcher', price: 3200, q: 2, minRep: 30, desc: 'Repeticiones, gráficos y muchas cámaras.' },
    audio_basic:  { name: 'Consola de audio 8 canales', icon: '🎚️', cat: 'audio',    price: 400,  q: 1, minRep: 0,  desc: 'Para micrófonos y música.' },
    audio_pro:    { name: 'Consola digital 18 canales', icon: '🎛️', cat: 'audio',    price: 1400, q: 2, minRep: 20, desc: 'Sonido limpio en eventos grandes.' },
    mics:         { name: 'Micrófonos inalámbricos',    icon: '🎤', cat: 'mics',     price: 350,  q: 1, minRep: 0,  desc: 'Mejoran el sonido en eventos con audio.' },
    encoder:      { name: 'Encoder SRT portátil',       icon: '📶', cat: 'encoder',  price: 700,  q: 1, minRep: 0,  desc: 'Envía la señal por internet de forma estable.' },
    router4g:     { name: 'Router 4G de respaldo',      icon: '🛜', cat: 'internet', price: 500,  q: 1, minRep: 0,  desc: 'Salva la transmisión si se cae el internet.' },
    ups:          { name: 'UPS / batería de respaldo',  icon: '🔋', cat: 'power',    price: 450,  q: 1, minRep: 0,  desc: 'Salva el evento si se va la luz.' },
    raincover:    { name: 'Cobertores de lluvia',       icon: '☂️', cat: 'rain',     price: 150,  q: 1, minRep: 0,  desc: 'Protege las cámaras en eventos al aire libre.' },
  };

  const CONSUMABLES = {
    cable:   { name: 'Cable de repuesto', icon: '🔌', price: 40, desc: 'Si se rompe un cable, lo cambias al instante.' },
    battery: { name: 'Batería extra',     icon: '🪫', price: 60, desc: 'Si una cámara se queda sin batería.' },
  };

  const EVENT_TYPES = {
    misa:        { name: 'Misa / ceremonia',        icon: '⛪', cams: [1, 1], audio: true,  stream: 0.3, outdoor: 0,   diff: 1, pay: [150, 280],    minRep: 0,
                   clients: ['Parroquia San José', 'Iglesia El Buen Pastor', 'Parroquia La Merced'] },
    boda:        { name: 'Boda',                     icon: '💍', cams: [1, 2], audio: true,  stream: 0.2, outdoor: 0.4, diff: 1, pay: [250, 480],    minRep: 0,
                   clients: ['Familia Andrade', 'Carla y Andrés', 'Familia Paredes', 'Familia Cevallos'] },
    prensa:      { name: 'Rueda de prensa',          icon: '🎙️', cams: [1, 2], audio: true,  stream: 1,   outdoor: 0,   diff: 1, pay: [200, 380],    minRep: 0,
                   clients: ['Municipio', 'Prefectura', 'Club Deportivo Los Andes'] },
    barrial:     { name: 'Partido de liga barrial',  icon: '⚽', cams: [2, 2], audio: false, stream: 1,   outdoor: 1,   diff: 2, pay: [300, 600],    minRep: 3,
                   clients: ['Liga Barrial La Floresta', 'Liga Parroquial Conocoto', 'Liga Barrial El Inca'] },
    graduacion:  { name: 'Graduación de colegio',    icon: '🎓', cams: [2, 2], audio: true,  stream: 0.6, outdoor: 0.2, diff: 2, pay: [350, 650],    minRep: 5,
                   clients: ['Colegio Nacional Mejía', 'Unidad Educativa Santa Ana', 'Colegio San Gabriel'] },
    lanzamiento: { name: 'Lanzamiento de marca',     icon: '🚀', cams: [2, 3], audio: true,  stream: 1,   outdoor: 0.2, diff: 3, pay: [900, 1600],   minRep: 12,
                   clients: ['Cervecería Montaña', 'Bebidas Volcán', 'Motos Kawa-Andes', 'Celulares Nébula'] },
    concierto:   { name: 'Concierto',                icon: '🎸', cams: [3, 4], audio: true,  stream: 1,   outdoor: 0.6, diff: 4, pay: [1600, 3000],  minRep: 28,
                   clients: ['Festival Sur Sonoro', 'Productora Tarima Viva', 'Coliseo Rumiñahui'] },
    ligapro:     { name: 'Partido de LigaPro',       icon: '🏟️', cams: [4, 4], audio: true,  stream: 1,   outdoor: 1,   diff: 4, pay: [2600, 4500],  minRep: 40,
                   clients: ['Club Atlético del Valle', 'Deportivo Cumbayá FC', 'Sporting Pichincha'] },
    final:       { name: 'Final de campeonato',      icon: '🏆', cams: [5, 6], audio: true,  stream: 1,   outdoor: 1,   diff: 5, pay: [6000, 10000], minRep: 65,
                   clients: ['Liga Nacional de Fútbol', 'Federación del Torneo'] },
  };

  const FIRST_NAMES = ['Kevin', 'Andrea', 'Luis', 'María José', 'Bryan', 'Gaby', 'Carlos', 'Daniela', 'Jonathan', 'Paola',
    'Stalin', 'Mishell', 'Fernando', 'Karla', 'Diego', 'Tania', 'Wilson', 'Jessica', 'Alex', 'Vane'];
  const LAST_NAMES = ['Guamán', 'Chiluisa', 'Pazmiño', 'Andrade', 'Toapanta', 'Morales', 'Cedeño', 'Quishpe',
    'Zambrano', 'Villacís', 'Tenorio', 'Ortiz', 'Lema', 'Salazar'];

  const STARS_PAY = [0, 0.4, 0.7, 1.0, 1.1, 1.25];
  const STARS_REP = [0, -5, -0.5, 2, 4, 6];

  /* ---------- Historia (capítulos) ---------- */
  const CHAPTERS = [
    {
      title: 'Capítulo 1 · El garaje',
      intro: 'Don Ramiro, tu antiguo jefe en el canal, se jubiló y te regaló su vieja cámara: "Con esto empecé yo. Ahora te toca a ti." Tienes un garaje, una cámara y muchas ganas.',
      goal: 'Completa 3 eventos',
      check: (s) => s.stats.events >= 3,
      progress: (s) => `${Math.min(s.stats.events, 3)}/3 eventos`,
      reward: 400,
      done: '"¡Así se empieza!", te escribe Don Ramiro, y te manda $400 para que sigas creciendo.',
    },
    {
      title: 'Capítulo 2 · Armando el equipo',
      intro: 'Solo no vas a llegar lejos. Necesitas gente de confianza y más equipo para cubrir eventos con varias cámaras.',
      goal: 'Ten 2 cámaras, 2 personas contratadas y 12 de fama',
      check: (s) => countCat(s, 'cam') >= 2 && s.staff.length >= 3 && s.rep >= 12,
      progress: (s) => `Cámaras ${Math.min(countCat(s, 'cam'), 2)}/2 · Personal ${Math.min(s.staff.length - 1, 2)}/2 · Fama ${Math.min(Math.floor(s.rep), 12)}/12`,
      reward: 800,
      done: 'Tu productora ya parece una empresa de verdad. Un amigo te recomienda con una marca grande: +$800 de adelanto.',
    },
    {
      title: 'Capítulo 3 · El gran lanzamiento',
      intro: 'Una marca busca productora para el lanzamiento de su nuevo producto. Habrá prensa e influencers. Es tu oportunidad de jugar en grande.',
      goal: 'Cubre un "Lanzamiento de marca" con 4 estrellas o más',
      target: 'lanzamiento',
      check: (s) => (s.stats.best.lanzamiento || 0) >= 4,
      progress: (s) => `Mejor resultado: ${s.stats.best.lanzamiento || 0}⭐ de 4⭐`,
      reward: 1500,
      done: 'El video del lanzamiento se hizo viral. Te llueven mensajes: +$1.500 de bono del cliente.',
    },
    {
      title: 'Capítulo 4 · La rival',
      intro: 'MegaVisión, la productora más grande de la ciudad, se enteró de ti. Empiezan a robarte clientes con precios más bajos. Tienes que ganarte un nombre.',
      goal: 'Llega a 40 de fama y junta $10.000',
      check: (s) => s.rep >= 40 && s.money >= 10000,
      progress: (s) => `Fama ${Math.min(Math.floor(s.rep), 40)}/40 · Dinero ${money(Math.min(s.money, 10000))}/$10.000`,
      reward: 2000,
      done: 'Un club de LigaPro quedó mal con MegaVisión: se les cayó la transmisión en pleno partido. Te llaman a ti. +$2.000 para prepararte.',
    },
    {
      title: 'Capítulo 5 · Al estadio',
      intro: 'Transmitir fútbol profesional es otra liga: 4 cámaras, gráficos, repeticiones y miles de personas mirando en vivo.',
      goal: 'Transmite un "Partido de LigaPro" con 4 estrellas o más',
      target: 'ligapro',
      check: (s) => (s.stats.best.ligapro || 0) >= 4,
      progress: (s) => `Mejor resultado: ${s.stats.best.ligapro || 0}⭐ de 4⭐`,
      reward: 3000,
      done: 'Los dirigentes quedaron felices. Te ofrecen la gran final: +$3.000 de adelanto.',
    },
    {
      title: 'Capítulo 6 · La final',
      intro: 'La final del campeonato. Todo el país estará mirando y MegaVisión hará lo imposible por verte fallar. Don Ramiro estará en primera fila.',
      goal: 'Transmite una "Final de campeonato" con 5 estrellas',
      target: 'final',
      check: (s) => (s.stats.best.final || 0) >= 5,
      progress: (s) => `Mejor resultado: ${s.stats.best.final || 0}⭐ de 5⭐`,
      reward: 5000,
      done: '¡Transmisión perfecta! Don Ramiro te abraza: "Ya no eres mi alumno, eres el mejor." Ganaste el modo historia. Puedes seguir jugando libre.',
    },
  ];

  /* ---------- Ayudantes ---------- */
  function countCat(s, cat) { return s.equip.filter((e) => CATALOG[e.type].cat === cat).length; }
  function nextId(s) { s.idc = (s.idc || 0) + 1; return s.idc; }
  function log(s, text) {
    s.log.unshift({ day: s.day, text });
    if (s.log.length > 80) s.log.length = 80;
  }
  function staffName(s) { return pick(s, FIRST_NAMES) + ' ' + pick(s, LAST_NAMES); }
  function repairCost(e) { return Math.round(CATALOG[e.type].price * 0.4 * (100 - e.condition) / 100); }
  function sellPrice(e) { return Math.round(CATALOG[e.type].price * 0.4 * e.condition / 100); }

  /* ---------- Juego nuevo ---------- */
  function newGame(seed) {
    const s = {
      v: SAVE_VERSION,
      seed: (seed === undefined ? Date.now() : seed) | 0,
      idc: 0,
      day: 1,
      money: 1500,
      rep: 5,
      chapter: 0,
      chapterSeen: -1,
      storyDone: false,
      gameOver: false,
      staff: [],
      candidates: [],
      equip: [],
      stock: { cable: 1, battery: 0 },
      contracts: [],
      currentEvent: null,
      lastResult: null,
      daily: { redes: 0, anuncio: 0 },
      stats: { events: 0, fiveStars: 0, earned: 0, best: {} },
      log: [],
    };
    s.staff.push({ id: nextId(s), name: 'Tú (dueño)', role: 'cam', skill: 2, wage: 0, morale: 100, events: 0, owner: true });
    s.equip.push({ id: nextId(s), type: 'cam_basic', condition: 75, nick: 'Cámara de Don Ramiro' });
    // Las 3 primeras ofertas son fáciles: sin transmisión por internet
    ['misa', 'boda', 'misa'].forEach((k) => { const c = addContract(s, k); c.stream = false; c.outdoor = false; c.cams = 1; c.daysLeft = 4; });
    refreshCandidates(s);
    log(s, 'Abriste tu productora en el garaje. ¡Mucha suerte!');
    return s;
  }

  /* ---------- Clientes / contratos ---------- */
  function availableTypes(s) {
    return Object.keys(EVENT_TYPES).filter((k) => EVENT_TYPES[k].minRep <= s.rep);
  }

  function addContract(s, typeKey, payBoost) {
    if (s.contracts.length >= 7) return null;
    const types = availableTypes(s);
    if (!typeKey) {
      // Más probabilidad de los eventos más grandes que ya desbloqueaste
      const weights = types.map((k, i) => 1 + i * 0.6);
      const total = weights.reduce((a, b) => a + b, 0);
      let r = rnd(s) * total;
      typeKey = types[types.length - 1];
      for (let i = 0; i < types.length; i++) { r -= weights[i]; if (r <= 0) { typeKey = types[i]; break; } }
    }
    const t = EVENT_TYPES[typeKey];
    const c = {
      id: nextId(s),
      type: typeKey,
      client: pick(s, t.clients),
      cams: randInt(s, t.cams[0], t.cams[1]),
      audio: t.audio,
      stream: chance(s, t.stream),
      outdoor: chance(s, t.outdoor),
      diff: t.diff,
      pay: Math.round(randInt(s, t.pay[0], t.pay[1]) * (1 + s.rep / 250) * (payBoost || 1) / 10) * 10,
      daysLeft: randInt(s, 2, 4),
    };
    s.contracts.push(c);
    return c;
  }

  /* Acciones para conseguir clientes */
  function marketing(s, kind) {
    if (s.currentEvent || s.gameOver) return { ok: false, msg: 'Ahora no se puede.' };
    if (kind === 'redes') {
      if (s.daily.redes >= 1) return { ok: false, msg: 'Ya publicaste hoy. Intenta mañana.' };
      if (s.money < 40) return { ok: false, msg: 'No tienes $40.' };
      if (s.contracts.length >= 7) return { ok: false, msg: 'Ya tienes demasiadas ofertas pendientes.' };
      s.money -= 40; s.daily.redes++;
      const c = addContract(s);
      log(s, `Publicaste en redes (-$40). Te escribió ${c.client}.`);
      return { ok: true, msg: `Publicaste en redes. Nueva oferta de ${c.client}.` };
    }
    if (kind === 'anuncio') {
      if (s.daily.anuncio >= 1) return { ok: false, msg: 'Ya pagaste un anuncio hoy.' };
      if (s.money < 200) return { ok: false, msg: 'No tienes $200.' };
      if (s.contracts.length >= 6) return { ok: false, msg: 'Ya tienes demasiadas ofertas pendientes.' };
      s.money -= 200; s.daily.anuncio++;
      addContract(s, null, 1.15); addContract(s, null, 1.15);
      log(s, 'Pagaste un anuncio (-$200). Llegaron 2 ofertas mejor pagadas.');
      return { ok: true, msg: 'Llegaron 2 ofertas mejor pagadas.' };
    }
    if (kind === 'visitar') {
      if (s.contracts.length >= 6) return { ok: false, msg: 'Ya tienes demasiadas ofertas pendientes.' };
      log(s, 'Pasaste el día visitando clientes en persona.');
      nextDay(s);
      addContract(s); addContract(s);
      return { ok: true, msg: 'Visitaste clientes todo el día. Conseguiste 2 ofertas.' };
    }
    return { ok: false, msg: 'Acción desconocida.' };
  }

  /* ---------- Personal ---------- */
  function refreshCandidates(s) {
    s.candidates = [];
    const roles = Object.keys(ROLES);
    for (let i = 0; i < 4; i++) {
      const maxSkill = clamp(1 + Math.floor(s.rep / 18), 1, 5);
      const skill = randInt(s, 1, maxSkill);
      s.candidates.push({
        id: nextId(s),
        name: staffName(s),
        role: i < roles.length ? roles[(i + s.day) % roles.length] : pick(s, roles),
        skill,
        wage: 15 + skill * 15 + randInt(s, 0, 10),
        morale: 80,
        events: 0,
      });
    }
  }

  function hire(s, candId) {
    const i = s.candidates.findIndex((c) => c.id === candId);
    if (i < 0) return { ok: false, msg: 'Esa persona ya no está disponible.' };
    const c = s.candidates[i];
    const fee = c.wage * 2;
    if (s.staff.length >= 12) return { ok: false, msg: 'Tu oficina está llena (máximo 12 personas).' };
    if (s.money < fee) return { ok: false, msg: `Necesitas ${money(fee)} para contratarle.` };
    s.money -= fee;
    s.candidates.splice(i, 1);
    s.staff.push(c);
    log(s, `Contrataste a ${c.name} (${ROLES[c.role].name}). Pago inicial ${money(fee)}.`);
    checkChapter(s);
    return { ok: true, msg: `${c.name} se unió al equipo.` };
  }

  function fire(s, staffId) {
    const i = s.staff.findIndex((p) => p.id === staffId);
    if (i < 0 || s.staff[i].owner) return { ok: false, msg: 'No se puede.' };
    const p = s.staff[i];
    s.staff.splice(i, 1);
    log(s, `Despediste a ${p.name}.`);
    return { ok: true, msg: `${p.name} ya no trabaja contigo.` };
  }

  function searchStaff(s) {
    if (s.money < 30) return { ok: false, msg: 'Necesitas $30 para publicar la vacante.' };
    s.money -= 30;
    refreshCandidates(s);
    return { ok: true, msg: 'Llegaron nuevos candidatos.' };
  }

  /* ---------- Tienda / bodega ---------- */
  function buy(s, type) {
    const it = CATALOG[type];
    if (!it) return { ok: false, msg: 'No existe.' };
    if (it.minRep > s.rep) return { ok: false, msg: `Necesitas ${it.minRep} de fama para que te lo vendan.` };
    if (s.money < it.price) return { ok: false, msg: `Te falta dinero (${money(it.price)}).` };
    if (s.equip.length >= 30) return { ok: false, msg: 'Tu bodega está llena.' };
    s.money -= it.price;
    s.equip.push({ id: nextId(s), type, condition: 100 });
    log(s, `Compraste: ${it.name} (${money(it.price)}).`);
    checkChapter(s);
    return { ok: true, msg: `Compraste ${it.name}.` };
  }

  function buyConsumable(s, key, qty) {
    const it = CONSUMABLES[key];
    qty = qty || 1;
    if (!it) return { ok: false, msg: 'No existe.' };
    if (s.money < it.price * qty) return { ok: false, msg: 'Te falta dinero.' };
    s.money -= it.price * qty;
    s.stock[key] = (s.stock[key] || 0) + qty;
    return { ok: true, msg: `Compraste ${qty} × ${it.name}.` };
  }

  function repair(s, equipId) {
    const e = s.equip.find((x) => x.id === equipId);
    if (!e) return { ok: false, msg: 'No existe.' };
    const cost = repairCost(e);
    if (cost <= 0) return { ok: false, msg: 'Está como nuevo.' };
    if (s.money < cost) return { ok: false, msg: `Reparar cuesta ${money(cost)}.` };
    s.money -= cost;
    e.condition = 100;
    log(s, `Reparaste ${CATALOG[e.type].name} (${money(cost)}).`);
    return { ok: true, msg: 'Quedó como nuevo.' };
  }

  function sell(s, equipId) {
    const i = s.equip.findIndex((x) => x.id === equipId);
    if (i < 0) return { ok: false, msg: 'No existe.' };
    const e = s.equip[i];
    const p = sellPrice(e);
    s.money += p;
    s.equip.splice(i, 1);
    log(s, `Vendiste ${CATALOG[e.type].name} por ${money(p)}.`);
    return { ok: true, msg: `Vendido por ${money(p)}.` };
  }

  /* ---------- Pasar el día ---------- */
  function nextDay(s) {
    if (s.gameOver) return;
    s.day++;
    s.daily = { redes: 0, anuncio: 0 };
    const rent = 20 + 4 * (s.staff.length - 1);
    s.money -= rent;
    // Ofertas que vencen
    s.contracts.forEach((c) => { c.daysLeft--; });
    const expired = s.contracts.filter((c) => c.daysLeft <= 0);
    if (expired.length) log(s, `Se vencieron ${expired.length} oferta(s) que no tomaste.`);
    s.contracts = s.contracts.filter((c) => c.daysLeft > 0);
    // Nuevas ofertas según la fama
    const n = randInt(s, 0, 1) + (s.rep >= 25 ? 1 : 0) + (s.contracts.length < 2 ? 1 : 0);
    for (let i = 0; i < n; i++) addContract(s);
    // Si el capítulo pide un evento especial, que aparezca
    const ch = CHAPTERS[s.chapter];
    if (ch && ch.target && !s.storyDone && EVENT_TYPES[ch.target].minRep <= s.rep &&
        !s.contracts.some((c) => c.type === ch.target) && chance(s, 0.5)) {
      addContract(s, ch.target);
    }
    // La rival roba clientes (desde el capítulo 4)
    if (s.chapter >= 3 && s.contracts.length > 1 && chance(s, 0.15)) {
      const i = randInt(s, 0, s.contracts.length - 1);
      const c = s.contracts[i];
      s.contracts.splice(i, 1);
      log(s, `😠 MegaVisión le ofreció un precio más bajo a ${c.client} y te quitó el contrato.`);
    }
    // Moral y renuncias
    s.staff.forEach((p) => { if (!p.owner) p.morale = clamp(p.morale + (p.morale < 60 ? 2 : 0), 0, 100); });
    const quitter = s.staff.find((p) => !p.owner && p.morale < 20 && chance(s, 0.4));
    if (quitter) {
      s.staff = s.staff.filter((p) => p !== quitter);
      log(s, `💔 ${quitter.name} renunció porque estaba desmotivado/a.`);
    }
    if (s.day % 3 === 1) refreshCandidates(s);
    if (s.money < -300) {
      s.gameOver = true;
      log(s, '💸 Quebraste: las deudas superaron los $300.');
    }
  }

  /* ---------- Calidad base del evento ---------- */
  function computeQuality(s, contract, staff, equip) {
    const parts = [];
    let q = 25;
    parts.push(['Base', 25]);
    const cams = equip.filter((e) => CATALOG[e.type].cat === 'cam');
    const camOps = staff.filter((p) => p.role === 'cam');
    const operated = Math.min(cams.length, camOps.length) + 0.5 * Math.max(0, cams.length - camOps.length);
    const cover = Math.round(25 * Math.min(1, operated / contract.cams));
    parts.push([`Cámaras cubiertas (${cams.length}/${contract.cams}, ${camOps.length} con operador)`, cover]);
    q += cover;
    if (cams.length > camOps.length) parts.push(['Cámaras fijas sin operador (valen la mitad)', 0]);

    const camQ = cams.length ? cams.reduce((a, e) => a + CATALOG[e.type].q * (0.5 + e.condition / 200), 0) / cams.length : 0;
    const camPts = Math.round(camQ * 4);
    parts.push(['Calidad de las cámaras', camPts]); q += camPts;

    const has = (cat) => equip.some((e) => CATALOG[e.type].cat === cat);
    const best = (role) => staff.filter((p) => p.role === role).reduce((m, p) => Math.max(m, p.skill), 0);

    if (contract.cams >= 2) {
      const d = best('dir');
      const sw = equip.filter((e) => CATALOG[e.type].cat === 'switcher').reduce((m, e) => Math.max(m, CATALOG[e.type].q), 0);
      let pts;
      if (d && sw) pts = d * 2 + sw * 2;
      else if (sw) pts = 0;
      else pts = -(6 + contract.diff * 3);
      parts.push([d && sw ? 'Director con switcher' : sw ? 'Switcher sin director' : 'Sin switcher para mezclar cámaras', pts]);
      q += pts;
    }
    if (contract.audio) {
      const a = best('audio');
      const cons = equip.filter((e) => CATALOG[e.type].cat === 'audio').reduce((m, e) => Math.max(m, CATALOG[e.type].q), 0);
      let pts;
      if (cons && a) pts = 4 + a * 1.5 + cons * 2;
      else if (cons) pts = 3;
      else pts = -(6 + contract.diff * 3);
      if (has('mics')) pts += 3;
      parts.push([cons ? (a ? 'Sonidista con consola' : 'Consola sin sonidista') : 'Sin consola de audio', Math.round(pts)]);
      q += pts;
    }
    if (contract.stream) {
      const t = best('stream');
      const canSend = has('encoder') || has('switcher');
      let pts;
      if (canSend && t) pts = 6 + t * 1.5 + (has('encoder') ? 2 : 0);
      else if (canSend) pts = 3;
      else pts = -(8 + contract.diff * 4);
      parts.push([canSend ? (t ? 'Técnico de streaming con equipo' : 'Equipo de streaming sin técnico') : 'Sin equipo para transmitir', Math.round(pts)]);
      q += pts;
    }
    const avgSkill = staff.length ? staff.reduce((a, p) => a + p.skill, 0) / staff.length : 0;
    const sk = Math.round(avgSkill * 2);
    parts.push(['Experiencia del equipo', sk]); q += sk;
    const dp = -(contract.diff * 4 + Math.max(0, contract.diff - 3) * 4);
    parts.push([`Dificultad del evento (${contract.diff})`, dp]); q += dp;
    return { q: clamp(Math.round(q), 0, 100), parts };
  }

  /* Elegir automáticamente lo mejor para un evento */
  function suggestLoadout(s, contractId) {
    const c = s.contracts.find((x) => x.id === contractId);
    if (!c) return { staffIds: [], equipIds: [] };
    const sortedStaff = (role) => s.staff.filter((p) => p.role === role).sort((a, b) => b.skill - a.skill);
    const staffIds = [];
    sortedStaff('cam').slice(0, c.cams).forEach((p) => staffIds.push(p.id));
    if (c.cams >= 2) sortedStaff('dir').slice(0, 1).forEach((p) => staffIds.push(p.id));
    if (c.audio) sortedStaff('audio').slice(0, 1).forEach((p) => staffIds.push(p.id));
    if (c.stream) sortedStaff('stream').slice(0, 1).forEach((p) => staffIds.push(p.id));
    const byCat = (cat) => s.equip.filter((e) => CATALOG[e.type].cat === cat)
      .sort((a, b) => (CATALOG[b.type].q * 100 + b.condition) - (CATALOG[a.type].q * 100 + a.condition));
    const equipIds = [];
    byCat('cam').slice(0, c.cams).forEach((e) => equipIds.push(e.id));
    if (c.cams >= 2 || c.stream) byCat('switcher').slice(0, 1).forEach((e) => equipIds.push(e.id));
    if (c.audio) { byCat('audio').slice(0, 1).forEach((e) => equipIds.push(e.id)); byCat('mics').slice(0, 1).forEach((e) => equipIds.push(e.id)); }
    if (c.stream) { byCat('encoder').slice(0, 1).forEach((e) => equipIds.push(e.id)); byCat('internet').slice(0, 1).forEach((e) => equipIds.push(e.id)); }
    byCat('power').slice(0, 1).forEach((e) => equipIds.push(e.id));
    if (c.outdoor) byCat('rain').slice(0, 1).forEach((e) => equipIds.push(e.id));
    return { staffIds, equipIds };
  }

          : { q: -14, msg: 'No volvió a prender. Perdiste ese equipo para el resto del evento.' }) },
        { label: 'Darle unos golpecitos', run: (s, ev, x) => {
          const e = s.equip.find((y) => y.id === x.eq);
          if (e) e.condition = clamp(e.condition - 10, 1, 100);
          return chance(s, 0.3) ? { q: -3, msg: '¡Funcionó! Pero quedó más dañada.' } : { q: -12, msg: 'Empeoró. Lección: hay que reparar el equipo.' };
        } },
        { label: 'Apagarla y seguir sin ella', run: () => ({ q: -9, msg: 'Seguiste con lo que quedaba.' }) },
      ],
    },
    epico: {
      weight: () => 2.5,
      when: () => true,
      text: (ev) => (['barrial', 'ligapro', 'final'].includes(ev.contract.type)
        ? '⚽ ¡GOLAZO de media cancha! Es el momento más épico del partido.'
        : '✨ ¡Momento épico! Todos lloran de emoción y tus cámaras lo captaron.'),
      choices: [
        { label: 'Repetición en cámara lenta', need: (s, ev) => (bestRole(ev, 'dir') && hasCat(ev, 'switcher') ? null : 'Necesitas director y switcher'),
          run: () => ({ q: 9, msg: '¡La repetición se volvió viral en redes!' }) },
        { label: 'Hacer zoom al rostro de la gente', need: (s, ev) => (camsOf(ev).length >= 2 ? null : 'Necesitas 2 cámaras o más'),
          run: () => ({ q: 5, msg: 'Toma emotiva. El cliente la va a usar en sus redes.' }) },
        { label: 'Seguir normal', run: () => ({ q: 2, msg: 'Quedó bien grabado.' }) },
      ],
    },
    vip: {
      weight: () => 2,
      when: (s, ev) => ev.contract.diff >= 2,
      text: () => '🕴️ Llegó un invitado muy importante y el cliente quiere una toma especial.',
      choices: [
        { label: 'Mandar a tu mejor camarógrafo', run: (s, ev) => {
          const p = bestRole(ev, 'cam');
          if (!p) return { q: -4, msg: 'No había quién.' };
          return { q: (p.skill - 2) * 3, msg: p.skill >= 3 ? `${p.name} consiguió una toma perfecta.` : `${p.name} hizo lo que pudo; la toma quedó regular.` };
        } },
        { label: 'Usar una cámara fija', run: () => ({ q: -2, msg: 'Toma aceptable, pero sin emoción.' }) },
      ],
    },
  };

  /* ---------- Evento en vivo ---------- */
  function startEvent(s, contractId, staffIds, equipIds) {
    if (s.currentEvent) return { ok: false, msg: 'Ya hay un evento en curso.' };
    if (s.gameOver) return { ok: false, msg: 'Juego terminado.' };
    const contract = s.contracts.find((c) => c.id === contractId);
    if (!contract) return { ok: false, msg: 'Esa oferta ya no existe.' };
    const staff = s.staff.filter((p) => staffIds.includes(p.id));
    const equip = s.equip.filter((e) => equipIds.includes(e.id));
    if (!staff.length) return { ok: false, msg: 'Lleva al menos una persona.' };
    if (!equip.some((e) => CATALOG[e.type].cat === 'cam')) return { ok: false, msg: 'Lleva al menos una cámara.' };
    const wages = staff.reduce((a, p) => a + p.wage, 0);
    const base = computeQuality(s, contract, staff, equip);
    const ev = {
      contract: Object.assign({}, contract),
      staffIds: staff.map((p) => p.id),
      equipIds: equip.map((e) => e.id),
      base: base.q,
      parts: base.parts,
      wages,
      deltas: [],
      incidents: [],
      step: 0,
    };
    // Elegir imprevistos
    const view = { contract: ev.contract, staff, equip };
    const worn = equip.filter((e) => e.condition < 40).length;
    const nInc = clamp(1 + Math.floor(contract.diff / 2) + (worn ? 1 : 0) + (chance(s, 0.3) ? 1 : 0), 1, 4);
    const pool = Object.keys(INCIDENTS).filter((k) => INCIDENTS[k].when(s, view));
    for (let i = 0; i < nInc && pool.length; i++) {
      const ws = pool.map((k) => INCIDENTS[k].weight(s, view));
      const tot = ws.reduce((a, b) => a + b, 0);
      let r = rnd(s) * tot, idx = pool.length - 1;
      for (let j = 0; j < pool.length; j++) { r -= ws[j]; if (r <= 0) { idx = j; break; } }
      const key = pool.splice(idx, 1)[0];
      const def = INCIDENTS[key];
      ev.incidents.push({ key, x: def.setup ? def.setup(s, view) : {}, done: false, result: null });
    }
    s.contracts = s.contracts.filter((c) => c.id !== contractId);
    s.currentEvent = ev;
    return { ok: true, msg: 'Evento iniciado.' };
  }

  function evView(s) {
    const ev = s.currentEvent;
    return {
      contract: ev.contract,
      staff: s.staff.filter((p) => ev.staffIds.includes(p.id)),
      equip: s.equip.filter((e) => ev.equipIds.includes(e.id)),
    };
  }

  function currentIncident(s) {
    const ev = s.currentEvent;
    if (!ev || ev.step >= ev.incidents.length) return null;
    const inc = ev.incidents[ev.step];
    const def = INCIDENTS[inc.key];
    const view = evView(s);
    return {
      n: ev.step + 1,
      total: ev.incidents.length,
      text: def.text(view, inc.x),
      choices: def.choices.map((c, i) => {
        const why = c.need ? c.need(s, view, inc.x) : null;
        return { i, label: c.label, ok: !why, why };
      }),
    };
  }

  function resolveIncident(s, choiceIndex) {
    const ev = s.currentEvent;
    if (!ev || ev.step >= ev.incidents.length) return { ok: false, msg: 'No hay imprevisto.' };
    const inc = ev.incidents[ev.step];
    const def = INCIDENTS[inc.key];
    const ch = def.choices[choiceIndex];
    if (!ch) return { ok: false, msg: 'Opción inválida.' };
    const view = evView(s);
    const why = ch.need ? ch.need(s, view, inc.x) : null;
    if (why) return { ok: false, msg: why };
    const r = ch.run(s, view, inc.x);
    inc.done = true;
    inc.result = r;
    ev.deltas.push(r.q);
    ev.step++;
    return { ok: true, q: r.q, msg: r.msg };
  }

  function finishEvent(s) {
    const ev = s.currentEvent;
    if (!ev) return { ok: false, msg: 'No hay evento.' };
    if (ev.step < ev.incidents.length) return { ok: false, msg: 'Faltan imprevistos por resolver.' };
    const c = ev.contract;
    const t = EVENT_TYPES[c.type];
    const quality = clamp(ev.base + ev.deltas.reduce((a, b) => a + b, 0), 0, 100);
    const stars = quality >= 85 ? 5 : quality >= 70 ? 4 : quality >= 55 ? 3 : quality >= 40 ? 2 : 1;
    const pay = Math.round(c.pay * STARS_PAY[stars]);
    const repRaw = STARS_REP[stars] * (0.5 + c.diff * 0.15);
    // Cuanta más fama tienes, más cuesta seguir subiendo
    const repDelta = Math.round(repRaw > 0 ? repRaw * (1 - s.rep / 130) : repRaw);
    s.money += pay - ev.wages;
    s.rep = clamp(s.rep + repDelta, 0, 100);
    // Desgaste de equipos, experiencia y moral del personal
    const view = evView(s);
    view.equip.forEach((e) => { e.condition = clamp(e.condition - randInt(s, 3, 6 + c.diff * 2), 1, 100); });
    const ups = [];
    view.staff.forEach((p) => {
      p.events++;
      if (!p.owner) p.morale = clamp(p.morale + (stars >= 4 ? 6 : stars <= 2 ? -10 : 1), 0, 100);
      if (p.skill < 5 && p.events % (3 + p.skill * 2) === 0) {
        p.skill++;
        if (!p.owner) p.wage += 12;
        ups.push(`${p.name} subió a habilidad ${p.skill}`);
      }
    });
    s.stats.events++;
    if (stars === 5) s.stats.fiveStars++;
    s.stats.earned += pay;
    s.stats.best[c.type] = Math.max(s.stats.best[c.type] || 0, stars);
    const result = {
      title: `${t.icon} ${t.name} — ${c.client}`,
      quality, stars, pay, wages: ev.wages, net: pay - ev.wages, repDelta, ups,
      base: ev.base, parts: ev.parts,
      incidents: ev.incidents.map((i) => ({ text: INCIDENTS[i.key].text(view, i.x), result: i.result })),
    };
    log(s, `${'⭐'.repeat(stars)} ${t.name} para ${c.client}: cobraste ${money(pay)}, sueldos ${money(ev.wages)}, fama ${repDelta >= 0 ? '+' : ''}${repDelta}.`);
    ups.forEach((u) => log(s, `📈 ${u}.`));
    s.currentEvent = null;
    s.lastResult = result;
    nextDay(s);
    result.chapterDone = checkChapter(s);
    return { ok: true, result };
  }

  /* ---------- Historia ---------- */
  function checkChapter(s) {
    if (s.storyDone) return null;
    const ch = CHAPTERS[s.chapter];
    if (!ch || !ch.check(s)) return null;
    s.money += ch.reward;
    log(s, `🏅 ¡${ch.title} completado! ${ch.done}`);
    const done = { title: ch.title, text: ch.done, reward: ch.reward };
    if (s.chapter >= CHAPTERS.length - 1) s.storyDone = true;
    else s.chapter++;
    return done;
  }

  /* ---------- Guardar / cargar ---------- */
  function serialize(s) { return JSON.stringify(s); }
  function deserialize(str) {
    try {
      const s = JSON.parse(str);
      if (!s || s.v !== SAVE_VERSION || !Array.isArray(s.staff)) return null;
      return s;
    } catch (e) { return null; }
  }

  const API = {
    ROLES, CATALOG, CONSUMABLES, EVENT_TYPES, CHAPTERS, INCIDENTS,
    newGame, addContract, marketing, refreshCandidates, hire, fire, searchStaff,
    buy, buyConsumable, repair, sell, repairCost, sellPrice, nextDay,
    computeQuality, suggestLoadout, startEvent, currentIncident, resolveIncident, finishEvent,
    checkChapter, countCat, serialize, deserialize, money,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = API;
  else root.Game = API;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   EN VIVO Tycoon — Pantallas (interfaz)
   Usa las reglas de js/logic.js (objeto global "Game").
   ========================================================= */
(function () {
  'use strict';
  const G = window.Game;
  const SAVE_KEY = 'envivo_tycoon_save_v1';
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const M = G.money;

  let S = null;            // estado del juego
  let tab = 'inicio';
  let prep = null;         // selección al preparar un evento
  let afterResult = null;  // capítulo completado pendiente de mostrar

  /* ---------- Guardado ---------- */
  function save() { try { localStorage.setItem(SAVE_KEY, G.serialize(S)); } catch (e) { /* sin espacio o modo privado */ } }
  function load() {
    try { const raw = localStorage.getItem(SAVE_KEY); return raw ? G.deserialize(raw) : null; } catch (e) { return null; }
  }

  /* ---------- Mensajes cortos ---------- */
  let toastT = null;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.style.display = 'none'; }, 2600);
  }
  function act(res) { if (res && res.msg) toast(res.msg); save(); render(); return res; }

  /* ---------- Ventana ---------- */
  function openModal(html) { $('modal').innerHTML = html; $('overlay').classList.add('on'); $('modal').scrollTop = 0; }
  function closeModal() { $('overlay').classList.remove('on'); $('modal').innerHTML = ''; }
  let confirmCb = null;
  function ask(text, yesLabel, cb) {
    confirmCb = cb;
    openModal(`<h2>¿Seguro?</h2><p>${text}</p>
      <button class="btn main" data-act="confirm-yes">${yesLabel}</button>
      <button class="btn" data-act="close">Cancelar</button>`);
  }

  /* ---------- Ayudantes visuales ---------- */
  const starsTxt = (n, max) => '★'.repeat(n) + '<span class="muted">' + '★'.repeat((max || 5) - n) + '</span>';
  function condBar(v) {
    const cls = v < 40 ? 'red' : v < 70 ? 'amber' : '';
    return `<div class="bar ${cls}"><i style="width:${v}%"></i></div>`;
  }
  function reqTags(c) {
    const t = [`<span class="tag">📹 ${c.cams} cámara${c.cams > 1 ? 's' : ''}</span>`];
    if (c.cams >= 2) t.push('<span class="tag">🎛️ switcher + director</span>');
    if (c.audio) t.push('<span class="tag">🎧 audio</span>');
    if (c.stream) t.push('<span class="tag red">📡 en vivo por internet</span>');
    if (c.outdoor) t.push('<span class="tag amber">🌦️ aire libre</span>');
    return t.join('');
  }

  /* ---------- Render general ---------- */
  function render() {
    $('hMoney').textContent = M(S.money);
    $('hMoney').classList.toggle('neg', S.money < 0);
    $('hRep').textContent = Math.floor(S.rep);
    $('hDay').textContent = S.day;
    $('badgeC').textContent = S.contracts.length || '';
    document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    document.querySelectorAll('main section').forEach((s) => s.classList.toggle('on', s.id === 'tab-' + tab));
    ({ inicio: renderInicio, clientes: renderClientes, personal: renderPersonal, bodega: renderBodega, registro: renderRegistro })[tab]();
    if (S.gameOver && !$('overlay').classList.contains('on')) showGameOver();
  }

  function renderInicio() {
    const ch = G.CHAPTERS[S.chapter];
    const rent = 20 + 4 * (S.staff.length - 1);
    let story;
    if (S.storyDone) {
      story = `<div class="card"><div class="story-tag">Modo historia</div><h2>🏆 ¡Historia completada!</h2>
        <p class="muted">Sigue creciendo en modo libre: más eventos, mejor equipo y más fama.</p></div>`;
    } else {
      story = `<div class="card"><div class="story-tag">Historia</div><h2>${esc(ch.title)}</h2>
        <p class="small muted">${esc(ch.intro)}</p>
        <p><b>🎯 Objetivo:</b> ${esc(ch.goal)}</p>
        <p class="small">Progreso: <span class="num">${esc(ch.progress(S))}</span></p>
        <p class="small muted">Premio: <span class="pay" style="font-size:14px">${M(ch.reward)}</span></p></div>`;
    }
    $('tab-inicio').innerHTML = story + `
      <div class="card">
        <div class="row between"><h3>Tu productora</h3><span class="muted small">Día ${S.day}</span></div>
        <div class="row wrap small" style="margin-top:6px">
          <span class="tag">👥 ${S.staff.length} personas</span>
          <span class="tag">📦 ${S.equip.length} equipos</span>
          <span class="tag">🎬 ${S.stats.events} eventos</span>
          <span class="tag">⭐ ${S.stats.fiveStars} de 5 estrellas</span>
        </div>
        <button class="btn main" data-act="tab" data-tab="clientes">📋 Ver ofertas de clientes (${S.contracts.length})</button>
        <button class="btn" data-act="next-day">😴 Descansar y pasar al día siguiente <span class="muted small">(gastos ${M(rent)})</span></button>
      </div>
      <div class="sectitle">Lo último que pasó</div>
      <div class="card log">${S.log.slice(0, 6).map((l) => `<p><span>Día ${l.day}</span>${esc(l.text)}</p>`).join('')}</div>
      <div class="sectitle">Ayuda rápida</div>
      <div class="card small muted">
        1) Toma una oferta en <b>Clientes</b>. 2) Elige personal y equipos. 3) Resuelve los imprevistos en vivo.
        4) Cobra, gana fama y compra mejor equipo en <b>Bodega</b>. Cada evento ocupa un día.
        Si tus deudas pasan de $300, quiebras.
      </div>
      <button class="btn" data-act="new-game" style="margin-bottom:20px">🔄 Empezar partida nueva</button>`;
  }

  function renderClientes() {
    const cards = S.contracts.map((c) => {
      const t = G.EVENT_TYPES[c.type];
      return `<div class="card">
        <div class="row"><div class="icon">${t.icon}</div>
          <div class="grow"><h3>${esc(t.name)}</h3><div class="small muted">${esc(c.client)}</div></div>
          <div class="pay">${M(c.pay)}</div></div>
        <div style="margin-top:6px">${reqTags(c)}</div>
        <div class="row between small" style="margin-top:8px">
          <span>Dificultad ${starsTxt(c.diff)}</span>
          <span class="${c.daysLeft <= 1 ? 'neg' : 'muted'}">⏳ vence en ${c.daysLeft} día${c.daysLeft > 1 ? 's' : ''}</span>
        </div>
        <button class="btn main" data-act="prep" data-id="${c.id}">Preparar evento</button>
      </div>`;
    }).join('');
    $('tab-clientes').innerHTML = `
      <div class="sectitle">Buscar clientes</div>
      <div class="card">
        <button class="btn" data-act="mkt" data-k="redes" ${S.daily.redes ? 'disabled' : ''}>📱 Publicar en redes <span class="muted small">($40 · 1 oferta · 1 vez al día)</span></button>
        <button class="btn" data-act="mkt" data-k="anuncio" ${S.daily.anuncio ? 'disabled' : ''}>📰 Pagar anuncio <span class="muted small">($200 · 2 ofertas mejor pagadas)</span></button>
        <button class="btn" data-act="mkt" data-k="visitar">🚶 Visitar clientes en persona <span class="muted small">(gratis · usa 1 día · 2 ofertas)</span></button>
      </div>
      <div class="sectitle">Ofertas disponibles (${S.contracts.length})</div>
      ${cards || '<div class="card muted">No tienes ofertas. Busca clientes con los botones de arriba o pasa al día siguiente.</div>'}`;
  }

  function renderPersonal() {
    const staff = S.staff.map((p) => `<div class="card">
      <div class="row"><div class="icon">${G.ROLES[p.role].icon}</div>
        <div class="grow"><h3>${esc(p.name)}</h3><div class="small muted">${G.ROLES[p.role].name} · ${p.events} eventos</div></div>
        <div class="small" style="text-align:right">Habilidad<br>${starsTxt(p.skill)}</div></div>
      ${p.owner ? '<p class="small muted">Eres tú. Cubres una cámara gratis.</p>' : `
      <div class="small muted" style="margin-top:8px">Moral ${p.morale}%</div>${condBar(p.morale)}
      <div class="row between" style="margin-top:10px"><span class="small">Cobra <b class="num">${M(p.wage)}</b> por evento</span>
        <button class="btn sm" data-act="fire" data-id="${p.id}">Despedir</button></div>`}
    </div>`).join('');
    const cands = S.candidates.map((c) => `<div class="card">
      <div class="row"><div class="icon">${G.ROLES[c.role].icon}</div>
        <div class="grow"><h3>${esc(c.name)}</h3><div class="small muted">${G.ROLES[c.role].name}</div></div>
        <div class="small" style="text-align:right">Habilidad<br>${starsTxt(c.skill)}</div></div>
      <div class="row between" style="margin-top:10px"><span class="small">Cobra <b class="num">${M(c.wage)}</b>/evento</span>
        <button class="btn sm main" data-act="hire" data-id="${c.id}">Contratar ${M(c.wage * 2)}</button></div>
    </div>`).join('');
    $('tab-personal').innerHTML = `
      <div class="sectitle">Tu equipo (${S.staff.length}/12)</div>${staff}
      <div class="sectitle">Candidatos</div>
      <p class="small muted">El pago inicial es 2 veces su sueldo. Solo pagas sueldo cuando le llevas a un evento.</p>
      ${cands || '<div class="card muted">No hay candidatos. Publica una vacante.</div>'}
      <button class="btn" data-act="search-staff" style="margin-bottom:20px">📢 Publicar vacante ($30)</button>`;
  }

  function renderBodega() {
    const cons = Object.keys(G.CONSUMABLES).map((k) => {
      const it = G.CONSUMABLES[k];
      return `<div class="pick"><div class="icon">${it.icon}</div>
        <div class="grow"><b>${it.name}</b> <span class="num">× ${S.stock[k] || 0}</span><div class="small muted">${it.desc}</div></div>
        <button class="btn sm" data-act="buy-cons" data-k="${k}">+1 ${M(it.price)}</button></div>`;
    }).join('');
    const mine = S.equip.map((e) => {
      const it = G.CATALOG[e.type];
      const rc = G.repairCost(e);
      return `<div class="card"><div class="row"><div class="icon">${it.icon}</div>
        <div class="grow"><b>${esc(e.nick || it.name)}</b><div class="small muted">Estado ${e.condition}%</div>${condBar(e.condition)}</div></div>
        <div class="row" style="margin-top:10px;justify-content:flex-end;gap:8px">
          <button class="btn sm" data-act="repair" data-id="${e.id}" ${rc <= 0 ? 'disabled' : ''}>🔧 Reparar ${rc > 0 ? M(rc) : ''}</button>
          <button class="btn sm" data-act="sell" data-id="${e.id}">Vender ${M(G.sellPrice(e))}</button></div></div>`;
    }).join('');
    const shop = Object.keys(G.CATALOG).map((k) => {
      const it = G.CATALOG[k];
      const locked = it.minRep > S.rep;
      const owned = S.equip.filter((e) => e.type === k).length;
      return `<div class="card"><div class="row"><div class="icon">${it.icon}</div>
        <div class="grow"><b>${it.name}</b>${owned ? ` <span class="tag">tienes ${owned}</span>` : ''}<div class="small muted">${it.desc}</div></div></div>
        <button class="btn ${locked ? '' : 'green'}" data-act="buy" data-k="${k}" ${locked || S.money < it.price ? 'disabled' : ''}>
          ${locked ? `🔒 Necesitas ${it.minRep} de fama` : `Comprar ${M(it.price)}`}</button></div>`;
    }).join('');
    $('tab-bodega').innerHTML = `
      <div class="sectitle">Repuestos (se usan solos en los imprevistos)</div><div class="card">${cons}</div>
      <div class="sectitle">Tus equipos (${S.equip.length})</div>${mine}
      <p class="small muted">El equipo se gasta en cada evento. Por debajo de 40% puede fallar en vivo.</p>
      <div class="sectitle">Tienda</div>${shop}<div style="height:20px"></div>`;
  }

  function renderRegistro() {
    $('tab-registro').innerHTML = `<div class="sectitle">Registro de la productora</div>
      <div class="card log">${S.log.map((l) => `<p><span>Día ${l.day}</span>${esc(l.text)}</p>`).join('')}</div>`;
  }

  /* ---------- Preparar evento ---------- */
  function openPrep(contractId) {
    const c = S.contracts.find((x) => x.id === contractId);
    if (!c) return;
    const sug = G.suggestLoadout(S, contractId);
    prep = { id: contractId, staff: new Set(sug.staffIds), equip: new Set(sug.equipIds) };
    renderPrep();
  }

  function renderPrep() {
    const c = S.contracts.find((x) => x.id === prep.id);
    if (!c) { closeModal(); return; }
    const t = G.EVENT_TYPES[c.type];
    const staff = S.staff.filter((p) => prep.staff.has(p.id));
    const equip = S.equip.filter((e) => prep.equip.has(e.id));
    const q = G.computeQuality(S, c, staff, equip);
    const wages = staff.reduce((a, p) => a + p.wage, 0);
    const est = q.q >= 85 ? 5 : q.q >= 70 ? 4 : q.q >= 55 ? 3 : q.q >= 40 ? 2 : 1;
    const worst = q.parts.filter((p) => p[1] < 0 && !/^Dificultad/.test(p[0])).sort((a, b) => a[1] - b[1])[0];
    const tip = worst ? `<p class="small" style="color:var(--amber)">💡 Lo que más te resta: ${esc(worst[0])} (${worst[1]}). Consíguelo en Bodega o Personal.</p>` : '';
    const staffHtml = S.staff.map((p) => `<label class="pick ${prep.staff.has(p.id) ? 'sel' : ''}">
        <input type="checkbox" data-act="tog-staff" data-id="${p.id}" ${prep.staff.has(p.id) ? 'checked' : ''}>
        <div class="grow"><b>${G.ROLES[p.role].icon} ${esc(p.name)}</b><div class="small muted">${G.ROLES[p.role].name} · ${starsTxt(p.skill)}</div></div>
        <span class="num small">${M(p.wage)}</span></label>`).join('');
    const equipHtml = S.equip.map((e) => {
      const it = G.CATALOG[e.type];
      return `<label class="pick ${prep.equip.has(e.id) ? 'sel' : ''}">
        <input type="checkbox" data-act="tog-equip" data-id="${e.id}" ${prep.equip.has(e.id) ? 'checked' : ''}>
        <div class="grow"><b>${it.icon} ${esc(e.nick || it.name)}</b>${condBar(e.condition)}</div>
        <span class="num small ${e.condition < 40 ? 'neg' : 'muted'}">${e.condition}%</span></label>`;
    }).join('');
    const pos = $('modal').scrollTop;
    openModal(`
      <div class="row between"><h2>${t.icon} ${esc(t.name)}</h2><button class="btn sm" data-act="close">✕</button></div>
      <div class="small muted">${esc(c.client)} · paga <span class="pay" style="font-size:15px">${M(c.pay)}</span> (con 3⭐)</div>
      <div style="margin:6px 0 4px">${reqTags(c)}</div>
      <button class="btn" data-act="auto">✨ Elegir lo mejor automáticamente</button>
      <div class="sectitle">¿A quién llevas?</div>${staffHtml}
      <div class="sectitle">¿Qué equipos llevas?</div>${equipHtml}
      <p class="small muted">Repuestos que llevas: 🔌 ${S.stock.cable} cables · 🪫 ${S.stock.battery} baterías</p>
      <details><summary>Ver cómo se calcula la calidad</summary>
        <table>${q.parts.map((p) => `<tr><td>${esc(p[0])}</td><td class="${p[1] < 0 ? 'down' : ''}">${p[1] > 0 ? '+' : ''}${p[1]}</td></tr>`).join('')}</table></details>
      <div class="preview">
        <div class="row between"><span>Calidad esperada <b class="num">${q.q}</b>/100</span><span>${starsTxt(est)}</span></div>
        <div class="bar ${q.q < 40 ? 'red' : q.q < 55 ? 'amber' : ''}"><i style="width:${q.q}%"></i></div>
        ${tip}
        <div class="small muted" style="margin-top:6px">Sueldos a pagar: <b class="num">${M(wages)}</b> · Los imprevistos pueden subir o bajar la calidad.</div>
        <button class="btn main" data-act="go-live">🔴 ¡Salir al aire!</button>
      </div>`);
    $('modal').scrollTop = pos;
  }

  /* ---------- Evento en vivo ---------- */
  function showIncident() {
    const inc = G.currentIncident(S);
    if (!inc) { finish(); return; }
    const c = S.currentEvent.contract;
    const t = G.EVENT_TYPES[c.type];
    openModal(`
      <div class="row between"><span class="live"><i></i>EN VIVO</span><span class="small muted">Imprevisto ${inc.n} de ${inc.total}</span></div>
      <div class="small muted" style="margin-top:8px">${t.icon} ${esc(t.name)} · ${esc(c.client)}</div>
      <div class="incident">${esc(inc.text)}</div>
      ${inc.choices.map((ch) => `<button class="btn choice" data-act="choose" data-i="${ch.i}" ${ch.ok ? '' : 'disabled'}>
        ${esc(ch.label)}${ch.ok ? '' : `<small>🚫 ${esc(ch.why)}</small>`}</button>`).join('')}`);
  }

  function choose(i) {
    const r = G.resolveIncident(S, i);
    if (!r.ok) { toast(r.msg); return; }
    save();
    const cls = r.q > 0 ? 'up' : r.q < 0 ? 'down' : '';
    const more = G.currentIncident(S);
    openModal(`
      <span class="live"><i></i>EN VIVO</span>
      <div class="incident">${esc(r.msg)}</div>
      <p>Calidad: <span class="delta ${cls}">${r.q > 0 ? '+' : ''}${r.q}</span></p>
      <button class="btn main" data-act="${more ? 'next-inc' : 'finish'}">${more ? 'Continuar ▶' : 'Terminar transmisión ⏹'}</button>`);
  }

  function finish() {
    const f = G.finishEvent(S);
    save();
    if (!f.ok) { toast(f.msg); closeModal(); render(); return; }
    const r = f.result;
    afterResult = r.chapterDone || null;
    openModal(`
      <h2>${esc(r.title)}</h2>
      <div class="stars">${starsTxt(r.stars)}</div>
      <div class="row between"><span>Calidad final</span><b class="num">${r.quality}/100</b></div>
      <div class="bar ${r.quality < 40 ? 'red' : r.quality < 55 ? 'amber' : ''}"><i style="width:${r.quality}%"></i></div>
      <table style="margin-top:12px">
        <tr><td>Pago del cliente</td><td class="up">+${M(r.pay)}</td></tr>
        <tr><td>Sueldos del personal</td><td class="down">-${M(r.wages)}</td></tr>
        <tr><td><b>Ganancia</b></td><td class="${r.net >= 0 ? 'up' : 'down'}"><b>${M(r.net)}</b></td></tr>
        <tr><td>Fama</td><td class="${r.repDelta >= 0 ? 'up' : 'down'}">${r.repDelta >= 0 ? '+' : ''}${r.repDelta}</td></tr>
      </table>
      ${r.ups.length ? `<p class="small">📈 ${r.ups.map(esc).join(' · ')}</p>` : ''}
      <details><summary>Ver detalle</summary>
        <p class="small"><b>Calidad inicial: ${r.base}</b></p>
        ${r.incidents.map((i) => `<p class="small">${esc(i.text)}<br><span class="muted">→ ${esc(i.result.msg)} (${i.result.q > 0 ? '+' : ''}${i.result.q})</span></p>`).join('')}
      </details>
      <p class="small muted">El equipo se desgastó un poco y pasó un día.</p>
      <button class="btn main" data-act="after-result">Continuar</button>`);
  }

  function showChapterDone(d) {
    openModal(`<div class="story-tag">🏅 Capítulo completado</div><h2>${esc(d.title)}</h2>
      <p class="story">${esc(d.text)}</p><p>Premio: <span class="pay">${M(d.reward)}</span></p>
      <button class="btn main" data-act="close-story">¡Vamos!</button>`);
  }

  function showChapterIntro() {
    if (S.storyDone || S.chapterSeen === S.chapter) return false;
    const ch = G.CHAPTERS[S.chapter];
    S.chapterSeen = S.chapter;
    save();
    openModal(`<div class="story-tag">Nuevo capítulo</div><h2>${esc(ch.title)}</h2>
      <p class="story">${esc(ch.intro)}</p><p><b>🎯 Objetivo:</b> ${esc(ch.goal)}</p>
      <button class="btn main" data-act="close">Entendido</button>`);
    return true;
  }

  function showGameOver() {
    openModal(`<h2>💸 Quebraste</h2>
      <p>Las deudas de tu productora pasaron de $300. Llegaste al día ${S.day} con ${S.stats.events} eventos cubiertos.</p>
      <p class="muted small">Consejo: no compres equipo caro muy pronto y lleva repuestos.</p>
      <button class="btn main" data-act="restart">Empezar de nuevo</button>`);
  }

  /* ---------- Clics ---------- */
  document.addEventListener('click', (e) => {
    const nav = e.target.closest('nav button');
    if (nav) { tab = nav.dataset.tab; render(); window.scrollTo(0, 0); return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const a = el.dataset.act;
    const id = el.dataset.id ? Number(el.dataset.id) : null;
    switch (a) {
      case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
      case 'close': closeModal(); render(); break;
      case 'confirm-yes': { const cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); break; }
      case 'next-day': G.nextDay(S); save(); render(); toast(`Día ${S.day}`); if (!showChapterIntro()) render(); break;
      case 'mkt': act(G.marketing(S, el.dataset.k)); break;
      case 'hire': act(G.hire(S, id)); showChapterIntro(); break;
      case 'fire': { const p = S.staff.find((x) => x.id === id); if (p) ask(`¿Despedir a ${esc(p.name)}?`, 'Sí, despedir', () => act(G.fire(S, id))); break; }
      case 'search-staff': act(G.searchStaff(S)); break;
      case 'buy': act(G.buy(S, el.dataset.k)); showChapterIntro(); break;
      case 'buy-cons': act(G.buyConsumable(S, el.dataset.k, 1)); break;
      case 'repair': act(G.repair(S, id)); break;
      case 'sell': { const it = S.equip.find((x) => x.id === id); if (it) ask(`¿Vender ${esc(G.CATALOG[it.type].name)} por ${M(G.sellPrice(it))}?`, 'Sí, vender', () => act(G.sell(S, id))); break; }
      case 'prep': openPrep(id); break;
      case 'auto': { const s = G.suggestLoadout(S, prep.id); prep.staff = new Set(s.staffIds); prep.equip = new Set(s.equipIds); renderPrep(); break; }
      case 'go-live': {
        const r = G.startEvent(S, prep.id, [...prep.staff], [...prep.equip]);
        if (!r.ok) { toast(r.msg); break; }
        save(); render(); showIncident(); break;
      }
      case 'choose': choose(Number(el.dataset.i)); break;
      case 'next-inc': showIncident(); break;
      case 'finish': finish(); break;
      case 'after-result':
        if (afterResult) { const d = afterResult; afterResult = null; showChapterDone(d); }
        else { closeModal(); render(); if (S.gameOver) showGameOver(); }
        break;
      case 'close-story': closeModal(); render(); if (!showChapterIntro() && S.gameOver) showGameOver(); break;
      case 'new-game': ask('Se borrará tu partida actual.', 'Sí, empezar de nuevo', () => { S = G.newGame(); save(); tab = 'inicio'; render(); showChapterIntro(); }); break;
      case 'restart': S = G.newGame(); save(); closeModal(); tab = 'inicio'; render(); showChapterIntro(); break;
    }
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (!el.dataset || !prep) return;
    const id = Number(el.dataset.id);
    if (el.dataset.act === 'tog-staff') { el.checked ? prep.staff.add(id) : prep.staff.delete(id); renderPrep(); }
    if (el.dataset.act === 'tog-equip') { el.checked ? prep.equip.add(id) : prep.equip.delete(id); renderPrep(); }
  });

  /* ---------- Inicio ---------- */
  S = load() || G.newGame();
  save();
  render();
  if (S.currentEvent) showIncident();       // si cerraste la app en pleno evento, sigue donde quedó
  else showChapterIntro();
  window.__game = { get state() { return S; } }; // para las pruebas automáticas
})();

</script>
</body>
</html>
