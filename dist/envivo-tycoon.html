        <rect x="164" y="80" width="32" height="14" rx="2" fill="${U('wht')}"/><rect x="170" y="64" width="20" height="16" rx="3" fill="${U('red')}"/><rect x="172" y="66" width="16" height="3" fill="#fff" opacity=".5"/>
        ${[[60, 30, '#ff3b3b'], [76, 42, '#4da3ff'], [290, 28, '#ffb020'], [306, 44, '#ff3b3b']].map(([x, y, c]) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="9" fill="${c}" class="crowd"/><ellipse cx="${x - 2}" cy="${y - 3}" rx="2" ry="3" fill="#fff" opacity=".4"/><path d="M${x} ${y + 9}q-3 20 0 40" stroke="#8b95a8" fill="none"/>`).join('')}`;
      floor = U('floorC');
      front = crowd2(128, 0.9, 154, 1.2, ['#1d2232', '#2a2d35', '#23283a'], { phones: 0.4 });
    } else if (kind === 'graduacion') {
      wall = '#1a1f33';
      deco = `<path d="M0 0h70q-10 50 0 96H0z" fill="${U('red')}"/><path d="M360 0h-70q10 50 0 96h70z" fill="${U('red')}"/><path d="M20 0q-6 50 0 96M44 0q-6 50 0 96M340 0q6 50 0 96M316 0q6 50 0 96" stroke="#000" stroke-opacity=".25" stroke-width="3"/>
        <rect x="90" y="16" width="180" height="22" rx="2" fill="#1f2c4a" stroke="#d9b44a"/><text x="180" y="31.5" font-size="11" font-family="${FONT_D}" font-weight="800" fill="#d9b44a" text-anchor="middle" letter-spacing="1">PROMOCIÓN 2026</text>
        ${cone(180, 0, 10, 94, 40)}${pool(180, 92, 50, 7)}
        <path d="M160 92V62h40v30z" fill="${U('wood')}"/><rect x="156" y="58" width="48" height="6" fill="#7a6248"/><path d="M180 58v-6" stroke="#2a2f3a" stroke-width="2"/><circle cx="180" cy="50" r="2.5" fill="#2a2f3a"/>`;
      floor = U('floorC');
      const r = rng(seed + 'g');
      front = crowd(seed, 128, 12, 0, 360, 0.9, ['#14151a', '#1d1f26'], { heads: true }) + `<path d="${Array.from({ length: 12 }, (_, i) => { const x = 15 + i * 30 + (r() - 0.5) * 6; return `M${(x - 9).toFixed(1)} 113l9-4 9 4-9 4z`; }).join('')}" fill="#0b0c10"/>` + crowd(seed + 'b', 154, 9, -10, 370, 1.2, ['#0b0c10', '#14151a'], { heads: true, delay: 0.3 });
    } else {
      wall = '#1c2232';
      deco = `<rect x="70" y="8" width="220" height="80" fill="#e9edf5" opacity=".07"/>
        <path d="${Array.from({ length: 4 }, (_, rr) => Array.from({ length: 6 }, (_, c) => `M${80 + c * 36 + (rr % 2) * 18} ${14 + rr * 18}h22v8h-22z`).join('')).join('')}" fill="#4da3ff" opacity=".22"/>
        ${cone(180, 0, 20, 86, 70)}
        <rect x="110" y="72" width="140" height="20" fill="#1d3b5e"/><rect x="110" y="72" width="140" height="3" fill="#4da3ff"/>
        ${[140, 180, 220].map((x, i) => `<circle cx="${x}" cy="60" r="6" fill="${['#c98a5e', '#e2b48f', '#b97f55'][i]}"/><path d="M${x - 9} 74a9 9 0 0 1 18 0z" fill="#2a2d35"/><path d="M${x + 4} 72l4-8" stroke="#1d2129" stroke-width="1.5"/><circle cx="${x + 8}" cy="63" r="1.8" fill="#1d2129"/>`).join('')}`;
      front = crowd2(128, 0.9, 154, 1.2, ['#2a2d35', '#23283a', '#33263a'], { phones: 0.35 });
    }
    return `<rect width="360" height="170" fill="${wall}"/>${deco}
      <path d="M0 92h360v78H0z" fill="${floor}"/><path d="M0 92h360" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>${extra}${front}`;
  }

  // Marcador para el fútbol (iniciales de los equipos y reloj que corre solo con CSS)
  const STOP = /^(liga|barrial|parroquial|club|deportivo|atl[eé]tico|del|de|la|el|los|las|fc|sporting|federaci[oó]n|nacional|f[uú]tbol|torneo|campeonato)$/i;
  function teamCode(name) {
    const words = String(name || '').split(/\s+/).filter(Boolean);
    const main = words.find((w) => !STOP.test(w));
    if (main) return main.normalize('NFD').replace(/[̀-ͯ]/g, '').slice(0, 3).toUpperCase();
    const ini = words.map((w) => w[0]).join('').toUpperCase();
    return (ini || 'LOC').slice(0, 3);
  }
  const AWAY = ['AND', 'COT', 'NOR', 'SUR', 'VOL', 'CHI', 'PAS', 'TUN'];
  function scoreboard(u, info, goal) {
    const client = (info && info.client) || 'Local';
    const h = hash(client + ((info && info.seed) || ''));
    const home = teamCode(client);
    let away = AWAY[h % AWAY.length];
    if (away === home) away = AWAY[(h + 1) % AWAY.length];
    const gh = (h >> 3) % 3 + (goal ? 1 : 0), ga = (h >> 5) % 2;
    const min = 10 + ((h >> 7) % 70);
    const digits = (n, cls) => `<g class="${cls}">${Array.from({ length: n + 1 }, (_, i) => `<text x="0" y="${7.5 + i * 10}" font-size="9" font-family="${FONT_M}" fill="#e9edf5" text-anchor="middle">${i % n}</text>`).join('')}</g>`;
    return `<g transform="translate(8 8)">
      <rect width="146" height="20" rx="4" fill="#0d0f14" fill-opacity=".92" stroke="#2a3242"/>
      <rect x="0" y="0" width="34" height="20" rx="4" fill="${U('red')}"/><rect x="30" y="0" width="4" height="20" fill="#d42a30"/>
      <text x="17" y="14" font-size="10.5" font-family="${FONT_D}" font-weight="800" fill="#fff" text-anchor="middle">${esc(home)}</text>
      <text x="51" y="14.5" font-size="11" font-family="${FONT_M}" fill="${goal ? '#ffb020' : '#fff'}" text-anchor="middle">${gh}-${ga}</text>
      <rect x="68" y="0" width="34" height="20" fill="#1d3b5e"/>
      <text x="85" y="14" font-size="10.5" font-family="${FONT_D}" font-weight="800" fill="#fff" text-anchor="middle">${away}</text>
      <text x="121" y="14" font-size="9" font-family="${FONT_M}" fill="#e9edf5" text-anchor="end">${min}:</text>
      <clipPath id="${u}clk"><rect x="120" y="5" width="18" height="10"/></clipPath>
      <g clip-path="url(#${u}clk)"><g transform="translate(125 5)">${digits(6, 'sb-t')}</g><g transform="translate(131.5 5)">${digits(10, 'sb-u')}</g></g>
    </g>`;
  }
  // Marcador de pelea (boxeo / lucha)
  function fightBoard(kind, info) {
    const h = hash((info && info.client) || kind);
    return `<g transform="translate(8 8)"><rect width="120" height="20" rx="4" fill="#0d0f14" fill-opacity=".92" stroke="#2a3242"/>
      <rect width="40" height="20" rx="4" fill="${U('red')}"/><text x="20" y="14" font-size="10" font-family="${FONT_D}" font-weight="800" fill="#fff" text-anchor="middle">${kind === 'lucha' ? 'CAÍDA' : 'ROUND'}</text>
      <text x="52" y="14.5" font-size="11" font-family="${FONT_M}" fill="#ffb020" text-anchor="middle">${(h % 3) + 1}</text>
      <text x="96" y="14.5" font-size="10" font-family="${FONT_M}" fill="#e9edf5" text-anchor="middle">${(h >> 4) % 3}:${String(10 + ((h >> 6) % 49)).padStart(2, '0')}</text></g>`;
  }

  const badge = (iconName, color) => `<g transform="translate(300 34)" class="fx-blink"><rect width="48" height="34" rx="6" fill="#0d0f14" fill-opacity=".9" stroke="${color}" stroke-width="1.5"/><g transform="translate(12 5)" color="${color}">${icon(iconName, '', 24)}</g></g>`;
  const FX = {
    lluvia: () => {
      const seg = (n, off, len, dx) => Array.from({ length: n }, (_, i) => `M${((i * 47 + off * 13) % 390) - 15} ${((i * 29 + off * 31) % 180) - 10}l-${dx} ${len}`).join('');
      return `<rect width="360" height="170" fill="#1a2a44" opacity=".34"/>
        <g class="fx-rain fx-rain-far"><path d="${seg(34, 3, 8, 2)}" stroke="#9ec5ff" stroke-width=".7" opacity=".4"/></g>
        <g class="fx-rain"><path d="${seg(26, 0, 14, 4)}" stroke="#bcd8ff" stroke-width="1.2" opacity=".65"/></g>
        <g class="fx-rain fx-rain-near"><path d="${seg(12, 7, 26, 7)}" stroke="#e1efff" stroke-width="2" opacity=".55" stroke-linecap="round"/></g>
        ${[[70, 160], [190, 150], [300, 162], [130, 140]].map(([x, y], i) => `<ellipse cx="${x}" cy="${y}" rx="10" ry="2.5" fill="none" stroke="#bcd8ff" stroke-width="1" class="ripple" style="animation-delay:${i * 0.3}s"/>`).join('')}`;
    },
    luz: () => `<rect width="360" height="170" fill="#000" fill-opacity=".75" class="fx-dark"/><g class="fx-blink"><circle cx="20" cy="20" r="4" fill="#ff3b3b"/><circle cx="20" cy="20" r="10" fill="#ff3b3b" opacity=".25"/><circle cx="340" cy="20" r="4" fill="#ff3b3b"/><circle cx="340" cy="20" r="10" fill="#ff3b3b" opacity=".25"/></g><rect x="128" y="74" width="104" height="20" rx="4" fill="#0d0f14" stroke="#ffb020"/><text x="180" y="88" font-size="10" font-family="${FONT_D}" font-weight="800" fill="#ffb020" text-anchor="middle">SIN ENERGÍA</text>`,
    cable: (ctx) => `<g class="fx-spark" transform="translate(${ctx.firstCamX} 140)"><path d="M0 0l8-10 4 6 10-12" stroke="#ffd23a" stroke-width="3" fill="none"/><path d="M-6 -4l-8-6M4 4l6 8" stroke="#fff" stroke-width="1.5"/><circle cx="0" cy="0" r="9" fill="${U('flame')}"/></g>`,
    internet: () => `${badge('wifi_off', '#ff3b3b')}<g class="fx-glitch" opacity=".5"><rect y="60" width="360" height="4" fill="#ff3b3b" opacity=".3"/><rect y="104" width="360" height="3" fill="#4da3ff" opacity=".3"/></g>`,
    acople: () => `<g class="fx-wave">${[0, 1, 2, 3].map((i) => `<circle cx="180" cy="90" r="${18 + i * 20}" fill="none" stroke="${i % 2 ? '#ffb020' : '#ff3b3b'}" stroke-width="2.2" style="animation-delay:${i * 0.22}s"/>`).join('')}</g>`,
    bateria: () => `<g transform="translate(300 34)" class="fx-blink"><rect width="48" height="30" rx="6" fill="#0d0f14" fill-opacity=".9" stroke="#ffb020" stroke-width="1.5"/><rect x="9" y="9" width="26" height="12" rx="2" fill="none" stroke="#ffb020" stroke-width="2"/><rect x="11" y="11" width="5" height="8" fill="#ff3b3b"/><path d="M37 13v4" stroke="#ffb020" stroke-width="2"/></g>`,
    epico: (ctx) => `<rect width="360" height="170" fill="#fff" opacity="0" class="fx-flash"/>${Array.from({ length: 30 }, (_, i) => `<rect x="${(i * 53) % 360}" y="-12" width="${4 + (i % 3)}" height="${7 + (i % 4)}" rx="1" fill="${['#ff3b3b', '#ffb020', '#4da3ff', '#2ecc71', '#ffd34d'][i % 5]}" class="fx-confetti" style="animation-delay:${(i % 9) * 0.13}s;animation-duration:${1.8 + (i % 4) * 0.25}s"/>`).join('')}
      ${ctx.football ? `<g class="fx-pop"><rect x="120" y="58" width="120" height="34" rx="6" fill="${U('red')}"/><text x="180" y="83" font-size="24" font-family="${FONT_D}" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">¡GOOOL!</text></g>` : ''}`,
    tarde: () => badge('clock', '#ffb020'),
    falla: (ctx) => `<rect width="360" height="170" fill="url(#${ctx.u}noise)" class="fx-glitch"/><g class="fx-glitch" style="animation-delay:-.1s"><rect y="40" width="360" height="6" fill="#ff3b3b" opacity=".18"/><rect y="118" width="360" height="5" fill="#2ecc71" opacity=".18"/></g>`,
    logo: (ctx) => `<g transform="translate(${ctx.board ? 200 : 14} ${ctx.board ? 8 : 14})" class="fx-pop"><rect width="80" height="22" rx="4" fill="${U('org')}"/><text x="40" y="15" font-size="10" font-family="${FONT_D}" font-weight="800" fill="#1a1205" text-anchor="middle">TU LOGO AQUÍ</text></g>
      <g transform="translate(80 118)"><rect width="200" height="18" rx="3" fill="#0d0f14" fill-opacity=".85" stroke="#ffb020"/><rect width="6" height="18" rx="2" fill="#ffb020"/><text x="14" y="12.5" font-size="8.5" font-family="${FONT_B}" font-weight="600" fill="#e9edf5">Video publicitario del cliente</text></g>`,
    vip: () => `${cone(180, 0, 10, 170, 40)}<path d="M160 170l8-58h24l8 58z" fill="${U('red')}" opacity=".7"/>
      <g transform="translate(300 34)"><rect width="48" height="22" rx="5" fill="${U('gold')}"/><text x="24" y="15.5" font-size="11" font-family="${FONT_D}" font-weight="800" fill="#1a1205" text-anchor="middle">VIP</text></g>`,
    permiso: () => badge('clients', '#ffb020'),
    transporte: () => `${badge('clock', '#ffb020')}${vanSide(-6, 128, 0.6, false)}`,
    robo: () => `${badge('lock', '#ff3b3b')}<path d="M40 150c10-30 30-40 40-60" stroke="#ff3b3b" stroke-width="2" stroke-dasharray="4 4" fill="none" class="fx-blink"/>`,
    senal: () => `<rect width="360" height="170" fill="#000" opacity=".35"/><g transform="translate(180 82)"><circle r="16" fill="none" stroke="#2a3242" stroke-width="4"/><g class="spin" style="animation-duration:.9s"><path d="M0 -16a16 16 0 0 1 16 16" stroke="#e9edf5" stroke-width="4" fill="none" stroke-linecap="round"/></g></g>${badge('stream', '#ff3b3b')}`,
    guion: () => badge('log', '#ffb020'),
    multitud: () => crowd('multitud', 150, 4, 30, 330, 3.4, ['#06070a', '#0a0b0f'], { anim: false }),
  };

  // Art.scene(tipo, imprevisto, cámaras, terminado, gear, info)
  //   gear: tipos de equipo que llevaste (opcional). info: { client, seed } (opcional)
  function scene(type, incident, camCount, done, gear, info) {
    try {
      const g = Array.isArray(gear) ? gear.filter((x) => typeof x === 'string') : null;
      const u = uid('s');
      const kind = sceneKind(type);
      const football = FOOTBALL.includes(kind);
      const fight = kind === 'boxeo' || kind === 'lucha';
      const inline = ensureShared() ? '' : sharedDefs();
      const bg = sceneBg(kind, u, info);
      const hasDrone = !!g && g.includes('dron4k');
      const hasJib = !!g && g.includes('grua');
      const hasVan = !!g && g.includes('unidad_movil');
      const hasGen = !!g && g.includes('generador');
      const hasSat = !!g && g.includes('vip_satelital');
      const total = Math.max(1, Math.min(Number(camCount) || 1, 6));
      let camTypes;
      if (g) {
        camTypes = g.filter((t) => { const it = catalogItem(t); return (it ? it.cat === 'cam' : /^cam_|^vip_cam/.test(t)) && t !== 'dron4k' && t !== 'grua'; });
        if (!camTypes.length && !hasDrone && !hasJib) camTypes = ['cam_basic'];
      } else camTypes = Array.from({ length: total }, () => 'cam_pro');
      camTypes = camTypes.slice(0, 5);
      const n = camTypes.length;
      const left = hasJib ? 120 : 40, right = hasVan ? 250 : 320;
      const xs = n === 1 ? [hasVan ? 230 : 250] : camTypes.map((_, i) => left + i * ((right - left) / Math.max(1, n - 1)));
      const firstCamX = xs.length ? xs[0] : 96;
      const cams = camTypes.map((t, i) => sceneCam(xs[i].toFixed(0), 136, t, 0.85, incident === 'cable' && i === 0)).join('');
      const jib = hasJib ? `<g><ellipse cx="56" cy="168" rx="20" ry="3" fill="#000" opacity=".45"/><path d="M44 170l12-36 12 36M56 134v36" stroke="#5b6476" stroke-width="2.4" stroke-linecap="round"/><rect x="49" y="128" width="14" height="8" rx="2" fill="${U('gm')}"/>
        <g class="jib" style="transform-origin:56px 132px"><path d="M22 150L150 70" stroke="#14171d" stroke-width="6" stroke-linecap="round"/><path d="M22 150L150 70" stroke="${U('cyal')}" stroke-width="3.6" stroke-linecap="round"/>
        <rect x="10" y="144" width="16" height="14" rx="2" fill="${U('gm')}"/><path d="M150 70v8" stroke="#14171d" stroke-width="2"/>
        <rect x="140" y="76" width="20" height="12" rx="2.5" fill="${U('al')}"/><rect x="158" y="78" width="6" height="8" rx="1.5" fill="${U('cyp')}"/><circle cx="144" cy="74" r="2" fill="#ff3b3b" class="blink"/></g></g>` : '';
      const drone = hasDrone ? `<g transform="translate(250 34)"><path d="M0 12l-18 50h36z" fill="${U('coneB')}" opacity=".5"/>${droneSmall(0, 0, 1.3, true)}</g>` : '';
      const van = hasVan ? vanSide(276, 124, 0.95, true) : '';
      const gen = hasGen ? `<g transform="translate(6 146)"><ellipse cx="15" cy="21" rx="18" ry="2.5" fill="#000" opacity=".45"/><rect width="30" height="20" rx="2" fill="${U('org')}"/><rect x="3" y="4" width="12" height="9" fill="#1d2129"/><circle cx="9" cy="8.5" r="2" fill="${incident === 'luz' ? '#2ecc71' : '#e9edf5'}"/><path d="M24 0v-6h5" stroke="#3a4150" stroke-width="2" fill="none"/><circle cx="31" cy="-9" r="3" fill="#c5ccd6" opacity=".35" class="puff"/></g>` : '';
      const sat = hasSat ? `<g transform="translate(${hasVan ? 250 : 330} 150) scale(.55)"><path d="M0 0l-12 26M0 0l12 26" stroke="#5b6476" stroke-width="3"/><g transform="rotate(-30 0 -6)"><ellipse cx="0" cy="-6" rx="20" ry="8" fill="${U('dishg')}"/></g></g>` : '';
      const ctx = { u, football, firstCamX, board: football || fight };
      const fx = !done && FX[incident] ? FX[incident](ctx) : '';
      const viewers = 120 + (hash(kind + (info && info.client)) % 900) * (football || kind === 'concierto' || fight ? 12 : 1);
      const vtxt = viewers >= 1000 ? (viewers / 1000).toFixed(1).replace('.', ',') + ' mil' : String(viewers);
      const counter = hasVan ? '' : `<g transform="translate(286 148)"><rect width="64" height="16" rx="3" fill="#0d0f14" fill-opacity=".78"/><circle cx="9" cy="8" r="3" fill="none" stroke="#e9edf5" stroke-width="1.4"/><circle cx="9" cy="8" r="1.2" fill="#e9edf5"/><text x="58" y="11.5" font-size="8.5" font-family="${FONT_M}" fill="#e9edf5" text-anchor="end">${vtxt}</text></g>`;
      return `<svg class="scene" viewBox="0 0 360 170" role="img" aria-label="Escena del evento">
      <defs>${inline}<pattern id="${u}noise" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="3" fill="#ffffff14"/><rect y="3" width="3" height="3" fill="#00000040"/></pattern></defs>
      ${bg}${jib}${van}${sat}${gen}${cams}${drone}
      <rect width="360" height="170" fill="${U('vig')}"/>
      ${football ? scoreboard(u, info, incident === 'epico' && !done) : fight ? fightBoard(kind, info) : ''}${fx}
      <g transform="translate(10 148)"><rect width="62" height="16" rx="3" fill="#ff3b3b"/><circle cx="10" cy="8" r="3" fill="#fff" class="blink"/><text x="38" y="12" font-size="10" font-family="${FONT_D}" font-weight="800" fill="#fff" text-anchor="middle">EN VIVO</text></g>
      ${counter}
    </svg>`;
    } catch (e) {
      return '<svg class="scene" viewBox="0 0 360 170" role="img" aria-label="Escena del evento"><rect width="360" height="170" fill="#161a22"/><text x="180" y="90" font-size="14" fill="#ff3b3b" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800">EN VIVO</text></svg>';
    }
  }

  root.Art = { icon, portrait, hq, scene, item, avatar, rarity, RARITIES, SUBTIPOS, subtipo: (t, o) => { try { return subtipoOf(t, o); } catch (e) { return 'case'; } }, PORTRAIT_NAMES };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   EN VIVO Tycoon — Conexión con el servidor (tienda, cuenta, partida en la nube)
   Contrato: server/API.md. Si el servidor no está (por ejemplo, el juego abierto como
   archivo o dentro de Claude), Api.disponible queda en false y el juego sigue funcionando
   sin tienda.
   ========================================================= */
(function (root) {
  'use strict';

  const Api = {
    disponible: null,   // null = todavía no se sabe; true / false
    estado: null,       // último /api/estado
  };

  function puedeIntentar() {
    try {
      const p = root.location && root.location.protocol;
      return p === 'https:' || p === 'http:';
    } catch (e) { return false; }
  }

  async function req(method, ruta, body, ms) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const t = ctrl ? setTimeout(() => ctrl.abort(), ms || 15000) : null;
    try {
      const r = await fetch(ruta, {
        method,
        headers: { 'Content-Type': 'application/json', 'X-Envivo': '1' },
        credentials: 'same-origin',
        cache: 'no-store',
        body: body === undefined ? undefined : JSON.stringify(body),
        signal: ctrl ? ctrl.signal : undefined,
      });
      let j = null;
      try { j = await r.json(); } catch (e) { j = null; }
      if (!j || typeof j !== 'object') throw new Error('El servidor no respondió bien. Intenta de nuevo.');
      if (!r.ok || j.ok === false) {
        const err = new Error(j.error || 'No se pudo completar. Intenta de nuevo.');
        err.status = r.status;
        throw err;
      }
      return j;
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('El servidor tardó demasiado. Revisa tu internet.');
      throw e;
    } finally {
      if (t) clearTimeout(t);
    }
  }

  function guardarEstado(j) {
    if (j && j.tienda) { Api.estado = j; Api.disponible = true; }
    return j;
  }

  /* Revisa si hay servidor y trae el estado del jugador. Nunca lanza error. */
  Api.iniciar = async function () {
    if (!puedeIntentar()) { Api.disponible = false; return null; }
    try {
      const j = await req('GET', '/api/estado', undefined, 8000);
      if (!j.tienda) throw new Error('sin tienda');
      return guardarEstado(j);
    } catch (e) {
      Api.disponible = false;
      return null;
    }
  };

  Api.refrescar = async () => guardarEstado(await req('GET', '/api/estado'));
  Api.registro = async (email, nombre, clave) => guardarEstado(await req('POST', '/api/registro', { email, nombre, clave }));
  Api.entrar = async (email, clave) => guardarEstado(await req('POST', '/api/entrar', { email, clave }));
  Api.salir = async () => { await req('POST', '/api/salir', {}); return Api.refrescar(); };
  Api.partida = () => req('GET', '/api/partida');
  Api.subirPartida = (datos) => req('POST', '/api/partida', { datos }, 20000);
  Api.gastar = (item) => req('POST', '/api/gastar', { item });
  Api.bonoVip = () => req('POST', '/api/vip/bono', {});
  Api.orden = (producto) => req('POST', '/api/orden', { producto });

  // Mercado entre jugadores (server/MERCADO.md)
  Api.mercado = (item, orden) => req('GET', '/api/mercado?' + new URLSearchParams({ item: item || '', orden: orden || 'precio' }).toString());
  Api.publicar = (inventario_id, precio) => req('POST', '/api/mercado/publicar', { inventario_id, precio });
  Api.retirar = (publicacion_id) => req('POST', '/api/mercado/retirar', { publicacion_id });
  Api.comprarMercado = (publicacion_id) => req('POST', '/api/mercado/comprar', { publicacion_id });

  // Comunidad: perfil, asociaciones y chat (server/SOCIAL.md)
  Api.perfil = (alias, fama) => req('POST', '/api/perfil', { alias, fama });
  Api.asociaciones = (buscar) => req('GET', '/api/asociaciones?' + new URLSearchParams({ buscar: buscar || '' }).toString());
  Api.crearAsociacion = (datos) => req('POST', '/api/asociaciones/crear', datos);
  Api.unirse = (id) => req('POST', '/api/asociaciones/unirse', { id });
  Api.salirAsociacion = () => req('POST', '/api/asociaciones/salir', {});
  Api.chat = (canal, desde) => req('GET', '/api/chat?' + new URLSearchParams({ canal, desde: String(desde || 0) }).toString(), undefined, 10000);
  Api.escribir = (canal, texto) => req('POST', '/api/chat', { canal, texto });
  Api.mensajeRapido = (canal, rapido) => req('POST', '/api/chat', { canal, rapido });
  Api.reportar = (mensaje_id, motivo) => req('POST', '/api/chat/reportar', { mensaje_id, motivo });
  Api.bloquear = (jugador_id) => req('POST', '/api/chat/bloquear', { jugador_id });

  Api.logueado = () => !!(Api.estado && Api.estado.logueado);

  root.Api = Api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   EN VIVO Tycoon — Compras premium dentro del juego
   - Agrega los equipos exclusivos al catálogo (no se pueden comprar con dinero del juego,
     ni vender, solo se consiguen en la tienda con créditos).
   - Aplica las "entregas" que manda el servidor (cada una UNA sola vez por partida).
   - Efectos del Pase VIP: reparaciones 30 % más baratas y 1 oferta extra al día.
   El saldo de créditos y el VIP los decide SIEMPRE el servidor (server/API.md).
   ========================================================= */
(function (root) {
  'use strict';
  const G = root.Game || (typeof require !== 'undefined' ? require('./logic.js') : null);

  const EXCLUSIVOS = {
    dron4k:       { name: 'Dron 4K',                        icon: 'dron',         cat: 'cam',      price: 0, q: 4, minRep: 0, premium: true, repairBase: 2200, desc: 'Tomas aéreas espectaculares. Cuenta como cámara de calidad 4.' },
    grua:         { name: 'Cámara en grúa telescópica',     icon: 'grua',         cat: 'cam',      price: 0, q: 4, minRep: 0, premium: true, repairBase: 2600, desc: 'Barridos de cine sobre el público. Cámara de calidad 4.' },
    unidad_movil: { name: 'Unidad móvil de transmisión',    icon: 'unidad_movil', cat: 'switcher', price: 0, q: 3, minRep: 0, premium: true, repairBase: 3500, desc: 'Un estudio completo sobre ruedas. Switcher de calidad 3.' },
    generador:    { name: 'Generador diésel',               icon: 'generador',    cat: 'power',    price: 0, q: 1, minRep: 0, premium: true, repairBase: 900,  desc: 'Si se va la luz, tú sigues al aire.' },
    // Solo VIP: se canjean con VIP activo y funcionan solo mientras el VIP esté activo
    vip_cam8k:     { name: 'Cámara de cine 8K Edición VIP', icon: 'cam_cine',     cat: 'cam',      price: 0, q: 5, minRep: 0, premium: true, vip: true, repairBase: 4000, desc: 'La mejor imagen del juego. Cámara de calidad 5.' },
    vip_switcher:  { name: 'Switcher de estudio VIP',       icon: 'switch_pro',   cat: 'switcher', price: 0, q: 4, minRep: 0, premium: true, vip: true, repairBase: 4200, desc: 'Repeticiones y gráficos de televisión. Switcher de calidad 4.' },
    vip_satelital: { name: 'Enlace satelital VIP',          icon: 'stream',       cat: 'internet', price: 0, q: 3, minRep: 0, premium: true, vip: true, repairBase: 2500, desc: 'Tu transmisión sale por satélite: el internet nunca te deja mal.' },
  };
  const DURABLES = ['item', 'personal'];   // se vuelven a entregar si empiezas partida nueva
  const VIP_DESCUENTO = 0.3;

  let vipActivo = false;

  function estado(s) {
    if (!s.premium || typeof s.premium !== 'object') s.premium = {};
    if (!Array.isArray(s.premium.aplicadas)) s.premium.aplicadas = [];
    return s.premium;
  }
  function anotar(s, text) {
    s.log.unshift({ day: s.day, text });
    if (s.log.length > 80) s.log.length = 80;
  }
  function nuevoId(s) { s.idc = (s.idc || 0) + 1; return s.idc; }
  const esPremium = (type) => !!(G.CATALOG[type] && G.CATALOG[type].premium);

  /* ---------- Catálogo y reglas protegidas ---------- */
  Object.keys(EXCLUSIVOS).forEach((k) => { G.CATALOG[k] = EXCLUSIVOS[k]; });

  function costoReparar(e) {
    const it = G.CATALOG[e.type];
    const base = it.premium ? it.repairBase : it.price;
    const c = Math.round(base * 0.4 * (100 - e.condition) / 100);
    return vipActivo ? Math.round(c * (1 - VIP_DESCUENTO)) : c;
  }

  const buyOriginal = G.buy;
  const sellOriginal = G.sell;
  G.buy = function (s, type) {
    if (esPremium(type)) return { ok: false, msg: 'Este equipo es exclusivo: se consigue en la Tienda con créditos.' };
    return buyOriginal(s, type);
  };
  G.sell = function (s, id) {
    const e = s.equip.find((x) => x.id === id);
    if (e && esPremium(e.type)) return { ok: false, msg: 'Los equipos exclusivos no se pueden vender.' };
    return sellOriginal(s, id);
  };
  const sellPriceOriginal = G.sellPrice;
  G.sellPrice = (e) => (esPremium(e.type) ? 0 : sellPriceOriginal(e));
  G.repairCost = costoReparar;
  G.repair = function (s, id) {
    const e = s.equip.find((x) => x.id === id);
    if (!e) return { ok: false, msg: 'No existe.' };
    const cost = costoReparar(e);
    if (cost <= 0) return { ok: false, msg: 'Está como nuevo.' };
    if (s.money < cost) return { ok: false, msg: `Reparar cuesta ${G.money(cost)}.` };
    s.money -= cost;
    e.condition = 100;
    anotar(s, `Reparaste ${G.CATALOG[e.type].name} (${G.money(cost)})${vipActivo ? ' con descuento VIP' : ''}.`);
    return { ok: true, msg: 'Quedó como nuevo.' };
  };

  /* ---------- Equipos VIP: guardados si el VIP no está activo ---------- */
  const esVip = (type) => !!(G.CATALOG[type] && G.CATALOG[type].vip);
  const bloqueado = (e) => esVip(e.type) && !vipActivo;
  const suggestOriginal = G.suggestLoadout;
  G.suggestLoadout = function (s, contractId) {
    const r = suggestOriginal(s, contractId);
    if (vipActivo) return r;
    // Sin VIP: quitar los equipos VIP y completar con lo mejor que quede de la misma categoría
    const quitados = r.equipIds.map((id) => s.equip.find((e) => e.id === id)).filter((e) => e && bloqueado(e));
    let ids = r.equipIds.filter((id) => !quitados.some((e) => e.id === id));
    quitados.forEach((q) => {
      const cat = G.CATALOG[q.type].cat;
      const alt = s.equip.filter((e) => G.CATALOG[e.type].cat === cat && !bloqueado(e) && !ids.includes(e.id))
        .sort((a, b) => (G.CATALOG[b.type].q * 100 + b.condition) - (G.CATALOG[a.type].q * 100 + a.condition))[0];
      if (alt) ids.push(alt.id);
    });
    return { staffIds: r.staffIds, equipIds: ids };
  };
  const startOriginal = G.startEvent;
  G.startEvent = function (s, contractId, staffIds, equipIds) {
    const ok = (equipIds || []).filter((id) => { const e = s.equip.find((x) => x.id === id); return e && !bloqueado(e); });
    return startOriginal(s, contractId, staffIds, ok);
  };

  /* ---------- Inventario del servidor (equipos que se pueden intercambiar en el mercado) ---------- */
  // Cada equipo del servidor vive en la partida con srvId. El servidor manda: si ya no está en su
  // inventario (lo publicaste o lo vendiste) sale de la bodega; si llegó uno nuevo, entra al 100 %.
  function sincronizarInventario(s, inventario) {
    if (!Array.isArray(inventario)) return { agregados: [], quitados: [] };
    const enUso = s.currentEvent ? s.currentEvent.equipIds : [];
    const ids = inventario.map((x) => x.id);
    const agregados = [], quitados = [];
    s.equip = s.equip.filter((e) => {
      if (e.srvId === undefined || ids.includes(e.srvId) || enUso.includes(e.id)) return true;
      quitados.push(G.CATALOG[e.type] ? G.CATALOG[e.type].name : e.type);
      return false;
    });
    inventario.forEach((x) => {
      if (!G.CATALOG[x.item] || s.equip.some((e) => e.srvId === x.id)) return;
      s.equip.push({ id: nuevoId(s), type: x.item, condition: 100, srvId: x.id, serie: x.serie });
      agregados.push(`${G.CATALOG[x.item].name}${x.serie ? ' #' + String(x.serie).padStart(4, '0') : ''}`);
    });
    agregados.forEach((t) => anotar(s, `🎁 Llegó a tu bodega: ${t}.`));
    quitados.forEach((t) => anotar(s, `🏷️ ${t} salió de tu bodega (mercado).`));
    return { agregados, quitados };
  }
  const nombreSerie = (e) => `${(G.CATALOG[e.type] || { name: e.type }).name}${e.serie ? ' #' + String(e.serie).padStart(4, '0') : ''}`;

  /* ---------- Entregas del servidor ---------- */
  const NOMBRE_ROL = { cam: 'Camarógrafo', dir: 'Director / vMix', audio: 'Sonidista', stream: 'Técnico de streaming' };
  const ESTRELLAS = ['Andrés "El Pulso" Vera', 'Majo Cifuentes', 'Rafa Tamayo', 'Doménica Arias', 'Javier "Zoom" Haro'];

  function aplicarUna(s, en) {
    const n = Math.max(1, Number(en.cantidad) || 1);
    switch (en.tipo) {
      case 'item': {
        const it = G.CATALOG[en.item];
        if (!it) return null;
        if (s.equip.length >= 40) return `No cupo ${it.name} en la bodega.`;
        s.equip.push({ id: nuevoId(s), type: en.item, condition: 100 });
        return `Llegó a tu bodega: ${it.name}.`;
      }
      case 'consumible': {
        if (!G.CONSUMABLES[en.item]) return null;
        s.stock[en.item] = (s.stock[en.item] || 0) + n;
        return `Recibiste ${n} × ${G.CONSUMABLES[en.item].name}.`;
      }
      case 'personal': {
        if (!G.ROLES[en.item]) return null;
        const skill = Math.min(5, Math.max(1, n));
        const usados = s.staff.map((p) => p.name);
        const name = ESTRELLAS.find((x) => !usados.includes(x)) || `Profesional ${nuevoId(s)}`;
        s.staff.push({ id: nuevoId(s), name, role: en.item, skill, wage: 25 + skill * 18, morale: 100, events: 0, premium: true });
        return `Se unió a tu equipo: ${name} (${NOMBRE_ROL[en.item]}, habilidad ${skill}).`;
      }
      case 'dinero': {
        s.money += n;
        return `Recibiste ${G.money(n)} para tu productora.`;
      }
      case 'reparar_todo': {
        s.equip.forEach((e) => { e.condition = 100; });
        return 'Todos tus equipos quedaron como nuevos.';
      }
      default: return null;
    }
  }

  /* Aplica las entregas que todavía no están en esta partida. Devuelve los textos de lo recibido. */
  function aplicarEntregas(s, entregas) {
    const p = estado(s);
    const hechos = [];
    (entregas || []).forEach((en) => {
      if (!en || typeof en.id !== 'number' || p.aplicadas.includes(en.id)) return;
      p.aplicadas.push(en.id);
      const t = aplicarUna(s, en);
      if (t) { hechos.push(t); anotar(s, '🎁 ' + t); }
    });
    return hechos;
  }

  /* Partida nueva: lo que se gasta (dinero, repuestos, reparaciones) no se vuelve a entregar;
     los equipos y el personal comprados sí (tus compras siguen siendo tuyas). */
  function prepararPartidaNueva(s, entregas) {
    const p = estado(s);
    p.aplicadas = (entregas || []).filter((en) => !DURABLES.includes(en.tipo)).map((en) => en.id);
    return aplicarEntregas(s, entregas);
  }

  /* ---------- VIP ---------- */
  function setVip(activo) { vipActivo = !!activo; }
  // Una oferta extra por día mientras el VIP está activo
  function tickVip(s) {
    const p = estado(s);
    if (!vipActivo || s.gameOver || s.currentEvent) return false;
    if (p.vipDia === s.day) return false;
    p.vipDia = s.day;
    const c = G.addContract(s);
    if (c) { c.vip = true; anotar(s, `⭐ VIP: ${c.client} te buscó directamente.`); return true; }
    return false;
  }

  root.Premium = { EXCLUSIVOS, aplicarEntregas, prepararPartidaNueva, sincronizarInventario, setVip, tickVip, esPremium, esVip, bloqueado, nombreSerie, costoReparar, get vip() { return vipActivo; } };
  if (typeof module !== 'undefined' && module.exports) module.exports = root.Premium;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   EN VIVO Tycoon — Mercado entre jugadores (pantalla)
   Reglas: server/MERCADO.md. El servidor decide todo (precios, dueños, créditos);
   esta pantalla solo muestra y pide. Se usa desde ui.js:
     Mercado.render(elemento, ctx)   ctx = { Api, G, Pm, A, estado(), toast, ask, openModal, closeModal, sincronizar, snd }
   ========================================================= */
(function (root) {
  'use strict';
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('es-EC');
  const serie = (n) => (n ? ' #' + String(n).padStart(4, '0') : '');
  let filtro = '', orden = 'precio', datos = null, cargando = false, error = '';

  function nombre(ctx, item) { const it = ctx.G.CATALOG[item]; return it ? it.name : item; }
  function dibujo(ctx, item) {
    try { if (ctx.A.item) return ctx.A.item(item, 64); } catch (e) { /* sin ilustración */ }
    return `<div class="tile t-amber">${ctx.A.icon(item)}</div>`;
  }
  function vence(iso) {
    const ms = Date.parse(iso) - Date.now();
    if (!(ms > 0)) return 'vence pronto';
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24;
    return d > 0 ? `vence en ${d} d ${h} h` : `vence en ${h} h`;
  }

  async function cargar(ctx, el) {
    if (cargando) return;
    cargando = true; error = '';
    try { datos = await ctx.Api.mercado(filtro, orden); } catch (e) { error = e.message; }
    cargando = false;
    pintar(ctx, el);
  }

  function tarjeta(ctx, p, mia) {
    const st = datos && datos.precios && datos.precios[p.item];
    return `<div class="card prod"><div class="row">${dibujo(ctx, p.item)}
        <div class="grow"><h3>${esc(nombre(ctx, p.item))}<span class="muted small">${serie(p.serie)}</span></h3>
          <div class="small muted">${mia ? 'Tu publicación' : 'Vende ' + esc(p.vendedor)} · ${vence(p.vence)}</div>
          ${st && st.ultimo ? `<div class="small muted">Última venta: ${num(st.ultimo)} créditos</div>` : ''}</div></div>
      <div class="row between" style="margin-top:10px"><span class="cr">${ctx.A.icon('gem', 'sm')} ${num(p.precio)}</span>
        ${mia ? `<button class="btn sm" data-merc="retirar" data-id="${p.id}">Retirar</button>`
              : `<button class="btn sm main" data-merc="comprar" data-id="${p.id}" ${datos.puede ? '' : 'disabled'}>Comprar</button>`}</div></div>`;
  }

  function pintar(ctx, el) {
    const E = ctx.Api.estado || {};
    if (!E.logueado) { el.innerHTML = '<div class="card muted">Entra a tu cuenta para ver el mercado.</div>'; return; }
    if (!datos && !error) { el.innerHTML = '<div class="card muted">Abriendo el mercado…</div>'; cargar(ctx, el); return; }
    if (error) {
      el.innerHTML = `<div class="card"><p class="small neg">${esc(error)}</p><button class="btn sm" data-merc="recargar">Intentar de nuevo</button></div>`;
      return;
    }
    const tipos = Object.keys(ctx.G.CATALOG).filter((k) => ctx.G.CATALOG[k].premium);
    const s = ctx.estado();
    const vendibles = s.equip.filter((e) => e.srvId !== undefined && !(s.currentEvent && s.currentEvent.equipIds.includes(e.id)));
    const ajenas = (datos.publicaciones || []).filter((p) => !p.mia);
    el.innerHTML = `
      ${datos.puede ? '' : `<div class="card" style="border-color:var(--amber)"><p class="small">${ctx.A.icon('lock', 'sm')} ${esc(datos.motivo || 'Compra cualquier paquete de créditos para comprar y vender en el mercado.')}</p></div>`}
      <div class="card">
        <label class="field">Equipo<select id="merc-filtro"><option value="">Todos</option>${tipos.map((k) => `<option value="${k}" ${k === filtro ? 'selected' : ''}>${esc(nombre(ctx, k))}</option>`).join('')}</select></label>
        <label class="field">Ordenar<select id="merc-orden"><option value="precio" ${orden === 'precio' ? 'selected' : ''}>Más barato primero</option><option value="reciente" ${orden === 'reciente' ? 'selected' : ''}>Más reciente</option></select></label>
        <p class="small muted">Comisión del mercado: ${Math.round((datos.comision || 0.05) * 100)} %. Los créditos no se cambian por dinero real.</p>
      </div>
      <div class="sectitle">En venta (${ajenas.length})</div>
      ${ajenas.map((p) => tarjeta(ctx, p, false)).join('') || '<div class="card muted small">Nadie está vendiendo este equipo ahora. Vuelve más tarde.</div>'}
      <div class="sectitle">Tus publicaciones (${(datos.mis_publicaciones || []).length}/10)</div>
      ${(datos.mis_publicaciones || []).map((p) => tarjeta(ctx, p, true)).join('') || '<div class="card muted small">No tienes equipos a la venta.</div>'}
      <div class="sectitle">Vender un equipo tuyo</div>
      ${vendibles.map((e) => `<div class="card"><div class="row">${dibujo(ctx, e.type)}
          <div class="grow"><b>${esc(nombre(ctx, e.type))}</b><span class="muted small">${serie(e.serie)}</span></div>
          <button class="btn sm" data-merc="publicar" data-id="${e.srvId}" ${datos.puede ? '' : 'disabled'}>Publicar</button></div></div>`).join('')
        || '<div class="card muted small">Solo se venden los equipos exclusivos y VIP que viven en tu cuenta.</div>'}`;
    const f = el.querySelector('#merc-filtro'), o = el.querySelector('#merc-orden');
    if (f) f.onchange = () => { filtro = f.value; datos = null; pintar(ctx, el); };
    if (o) o.onchange = () => { orden = o.value; datos = null; pintar(ctx, el); };
  }

  async function despues(ctx, el, msg) {
    try { await ctx.Api.refrescar(); } catch (e) { /* se reintenta al volver */ }
    ctx.sincronizar();
    if (msg) ctx.toast(msg);
    datos = null; pintar(ctx, el);
  }

  function clic(ctx, el, b) {
    const acc = b.dataset.merc, id = Number(b.dataset.id);
    if (acc === 'recargar') { datos = null; error = ''; pintar(ctx, el); return; }
    if (acc === 'comprar') {
      const p = (datos.publicaciones || []).find((x) => x.id === id);
      if (!p) return;
      const cr = (ctx.Api.estado || {}).creditos || 0;
      if (cr < p.precio) { ctx.toast(`Te faltan ${num(p.precio - cr)} créditos.`); ctx.snd.play('error'); return; }
      ctx.ask(`¿Comprar <b>${esc(nombre(ctx, p.item))}${serie(p.serie)}</b> por ${num(p.precio)} créditos?<br><span class="small muted">Te quedarán ${num(cr - p.precio)} créditos.</span>`, 'Sí, comprar', async () => {
        try { await ctx.Api.comprarMercado(id); ctx.snd.play('buy'); await despues(ctx, el, '¡Compra hecha! El equipo llegó a tu bodega.'); }
        catch (e) { ctx.toast(e.message); ctx.snd.play('error'); datos = null; pintar(ctx, el); }
      });
      return;
    }
    if (acc === 'retirar') {
      ctx.ask('¿Retirar esta publicación? El equipo vuelve a tu bodega.', 'Sí, retirar', async () => {
        try { await ctx.Api.retirar(id); await despues(ctx, el, 'El equipo volvió a tu bodega.'); } catch (e) { ctx.toast(e.message); }
      });
      return;
    }
    if (acc === 'publicar') {
      const e = ctx.estado().equip.find((x) => x.srvId === id);
      if (!e) return;
      const st = datos.precios && datos.precios[e.type];
      const sug = (st && (st.minimo_publicado || st.ultimo)) || 100;
      ctx.openModal(`<h2>Vender ${esc(nombre(ctx, e.type))}${serie(e.serie)}</h2>
        <label class="field">Precio en créditos (10 a 100.000)<input id="merc-precio" type="number" inputmode="numeric" min="10" max="100000" step="1" value="${sug}"></label>
        <p class="small muted" id="merc-recibes"></p>
        <p class="small muted">Mientras esté publicado, el equipo sale de tu bodega. Si en 7 días nadie lo compra, vuelve solo.</p>
        <button class="btn main" data-merc="confirmar-publicar" data-id="${id}">Publicar</button>
        <button class="btn" data-act="close">Cancelar</button>`);
      const inp = document.getElementById('merc-precio'), rec = document.getElementById('merc-recibes');
      const upd = () => { const v = Math.floor(Number(inp.value) || 0); rec.textContent = v >= 10 ? `Recibirás ${num(Math.floor(v * (1 - (datos.comision || 0.05))))} créditos si se vende.` : 'Mínimo 10 créditos.'; };
      inp.oninput = upd; upd();
      return;
    }
    if (acc === 'confirmar-publicar') {
      const v = Math.floor(Number(document.getElementById('merc-precio').value) || 0);
      if (v < 10 || v > 100000) { ctx.toast('El precio debe estar entre 10 y 100.000 créditos.'); return; }
      ctx.Api.publicar(id, v).then(async () => { ctx.closeModal(); ctx.snd.play('logo'); await despues(ctx, el, 'Tu equipo ya está a la venta.'); })
        .catch((err) => ctx.toast(err.message));
    }
  }

  root.Mercado = {
    render(el, ctx) {
      pintar(ctx, el);
      el.onclick = (ev) => { const b = ev.target.closest('[data-merc]'); if (b && !b.disabled && el.contains(b)) clic(ctx, el, b); };
    },
    // El botón de confirmar está en la ventana (fuera del elemento): ui.js reenvía estos clics
    clicVentana(ctx, el, b) { clic(ctx, el, b); },
    invalidar() { datos = null; error = ''; },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* =========================================================
   EN VIVO Tycoon — Chat y asociaciones (pantalla)
   Contrato: server/SOCIAL.md. Botón flotante con contador de no leídos; panel con pestañas
   Servidor / Asociación. Mientras el panel está abierto consulta cada 3 s; cerrado, cada 20 s.

(function (root) {

  const st = { ctx: null, abierto: false, canal: 'servidor', mensajes: { servidor: [], asociacion: [] }, ultimo: { servidor: 0, asociacion: 0 },
    leidos: { servidor: 0, asociacion: 0 }, timer: null, enviando: false, asociaciones: null };

  function css() {
    if (document.getElementById('chat-css')) return;
    const s = document.createElement('style');
    s.id = 'chat-css';
    s.textContent = `
      #chat-btn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:7;width:52px;height:52px;border-radius:50%;
        background:var(--red);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 6px 18px #0008}
      #chat-btn .ico{width:24px;height:24px}
      #chat-btn b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--amber);color:#1a1205;font-size:11px;display:grid;place-items:center;padding:0 5px}
      #chat-panel{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
      #chat-panel[hidden]{display:none}
      .chat-top{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
      .chat-tabs{display:flex;gap:6px;flex:1}
      .chat-tabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:600}
      .chat-tabs button.on{border-color:var(--red);background:#2a1a1f}
      .chat-lista{flex:1;overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
      .chat-msg{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 10px;max-width:88%;min-width:0}
      .chat-msg.yo{align-self:flex-end;border-radius:12px 4px 12px 12px;background:#22161a;border-color:#4a2228}
      .chat-msg .quien{font-size:12px;color:var(--amber);font-weight:600}
      .chat-msg .quien span{color:var(--muted);font-weight:400;margin-left:6px}
      .chat-msg p{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
      .chat-rapidos{display:flex;gap:6px;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
      .chat-rapidos button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap}
      .chat-form{display:flex;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
      .chat-form input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
      .chat-vacio{color:var(--muted);text-align:center;font-size:13px;margin:auto}`;
    document.head.appendChild(s);
  }

  function noLeidos() {
    return ['servidor', 'asociacion'].reduce((a, c) => a + st.mensajes[c].filter((m) => m.id > st.leidos[c]).length, 0);
  }
  function pintarBoton() {
    const b = document.getElementById('chat-btn');
    if (!b) return;
    const E = st.ctx.Api.estado;
    b.hidden = !(st.ctx.Api.disponible && E && E.logueado);
    const n = st.abierto ? 0 : noLeidos();
    b.innerHTML = st.ctx.A.icon('social') + (n ? `<b>${n > 99 ? '99+' : n}</b>` : '');
  }

  function hora(iso) { try { return new Date(iso).toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

  function pintarLista() {
    const el = document.getElementById('chat-lista');
    if (!el) return;
    const E = st.ctx.Api.estado || {};
    if (st.canal === 'asociacion' && !E.asociacion) { pintarAsociaciones(el); return; }
    const yo = E.jugador ? E.jugador.id : null;
    const ms = st.mensajes[st.canal];
    el.innerHTML = ms.length ? ms.map((m) => `<div class="chat-msg ${m.jugador_id === yo ? 'yo' : ''}" data-msg="${m.id}">
        <div class="quien">${m.siglas ? '[' + esc(m.siglas) + '] ' : ''}${esc(m.alias || 'Productora')}${m.vip ? ' ⭐' : ''}<span>${hora(m.creado)}</span></div>
        <p>${esc(m.texto)}</p></div>`).join('')
      : `<p class="chat-vacio">Todavía no hay mensajes. ¡Saluda a ${st.canal === 'servidor' ? 'las productoras del servidor' : 'tu asociación'}!</p>`;
    el.scrollTop = el.scrollHeight;
    st.leidos[st.canal] = ms.length ? ms[ms.length - 1].id : st.leidos[st.canal];
  }

  async function pintarAsociaciones(el) {
    el.innerHTML = '<p class="chat-vacio">Buscando asociaciones…</p>';
    let lista = [];
    try { const r = await st.ctx.Api.asociaciones(''); lista = r.asociaciones || []; } catch (e) { el.innerHTML = `<p class="chat-vacio">${esc(e.message)}</p>`; return; }
    if (st.canal !== 'asociacion') return;
    el.innerHTML = `<div class="card"><h3>Únete a una asociación</h3><p class="small muted">Con tu asociación juegas la Liga Semanal, el Mega Festival y la Gran Licitación, y tienes chat propio.</p>
        <button class="btn main" data-chat="crear">Crear una asociación</button></div>
      ${lista.map((a) => `<div class="card"><div class="row between"><div><b style="color:${/^#[0-9a-f]{6}$/i.test(a.color || '') ? a.color : 'var(--amber)'}">[${esc(a.siglas)}]</b> <b>${esc(a.nombre)}</b>
          <div class="small muted">${a.miembros || 0}/20 socios · ${a.ingreso === 'abierto' ? 'entrada libre' : 'con solicitud'}</div></div>
          <button class="btn sm" data-chat="unirse" data-id="${a.id}">${a.ingreso === 'abierto' ? 'Unirme' : 'Pedir entrar'}</button></div></div>`).join('')
      || '<p class="chat-vacio">Todavía no hay asociaciones en tu servidor. ¡Crea la primera!</p>'}`;
  }

  async function consultar(canal) {
    const E = st.ctx.Api.estado;
    if (!E || !E.logueado) return false;
    if (canal === 'asociacion' && !E.asociacion) return false;
    try {
      const r = await st.ctx.Api.chat(canal, st.ultimo[canal]);
      const nuevos = (r.mensajes || []).filter((m) => m.id > st.ultimo[canal]);
      if (!nuevos.length) return false;
      st.mensajes[canal] = st.mensajes[canal].concat(nuevos).slice(-150);
      st.ultimo[canal] = st.mensajes[canal][st.mensajes[canal].length - 1].id;
      return true;
    } catch (e) { return false; }
  }

  async function ciclo() {
    clearTimeout(st.timer);
    const E = st.ctx.Api.estado;
    if (st.ctx.Api.disponible && E && E.logueado && document.visibilityState !== 'hidden') {
      const cambios = await Promise.all([consultar('servidor'), consultar('asociacion')]);
      if (st.abierto && cambios.some(Boolean)) pintarLista();
      pintarBoton();
    } else pintarBoton();
    st.timer = setTimeout(ciclo, st.abierto ? 3000 : 20000);
  }

  function abrir() {
    st.abierto = true;
    const p = document.getElementById('chat-panel');
    p.hidden = false;
    p.querySelectorAll('[data-chat-tab]').forEach((b) => b.classList.toggle('on', b.dataset.chatTab === st.canal));
    const conChat = !(st.canal === 'asociacion' && !(st.ctx.Api.estado || {}).asociacion);
    p.querySelector('.chat-form').hidden = !conChat;
    p.querySelector('.chat-rapidos').hidden = !conChat;
    pintarLista(); pintarBoton(); ciclo();
  }
  function cerrar() { st.abierto = false; document.getElementById('chat-panel').hidden = true; pintarBoton(); ciclo(); }

  async function enviar(texto, rapido) {
    if (st.enviando) return;
    st.enviando = true;
    try {
      if (rapido) await st.ctx.Api.mensajeRapido(st.canal, rapido);
      else await st.ctx.Api.escribir(st.canal, texto);

      await consultar(st.canal); pintarLista();
    } catch (e) { st.ctx.toast(e.message); st.ctx.snd.play('error'); }

  }

        <button class="btn sm" data-chat="cerrar" aria-label="Cerrar chat">${st.ctx.A.icon('close', 'sm')}</button></div>
      <div class="chat-lista" id="chat-lista"></div>
      <div class="chat-rapidos">${RAPIDOS.map(([k, t]) => `<button data-chat="rapido" data-k="${k}">${esc(t)}</button>`).join('')}</div>
      <form class="chat-form" id="chat-form"><input id="chat-texto" maxlength="300" autocomplete="off" placeholder="Escribe un mensaje" aria-label="Mensaje">
        <button class="btn sm main" type="submit">Enviar</button></form>`;
    document.body.appendChild(p);
    p.addEventListener('click', (ev) => {
      const t = ev.target.closest('[data-chat-tab]');
      if (t) { st.canal = t.dataset.chatTab; abrir(); return; }
      const a = ev.target.closest('[data-chat]');
      if (a) {
        const k = a.dataset.chat;
        if (k === 'cerrar') cerrar();
        else if (k === 'rapido') enviar('', a.dataset.k);
        else if (k === 'unirse') st.ctx.Api.unirse(Number(a.dataset.id)).then(async (r) => { await st.ctx.Api.refrescar(); st.ctx.toast(r.mensaje || '¡Listo!'); abrir(); }).catch((e) => st.ctx.toast(e.message));
        else if (k === 'crear') crearAsociacion();

      }
      const m = ev.target.closest('[data-msg]');
      if (m && !m.classList.contains('yo')) opcionesMensaje(Number(m.dataset.msg));
    });
    p.querySelector('#chat-form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const v = document.getElementById('chat-texto').value.trim();
      if (v) enviar(v);
    });
  }

  function crearAsociacion() {
    const nombre = prompt === undefined ? null : null;   // el visor no permite prompt(): se usa un formulario propio
    void nombre;
    const el = document.getElementById('chat-lista');
    el.innerHTML = `<form class="card" id="form-asoc"><h3>Nueva asociación</h3>
        <label class="field">Nombre (3 a 30 letras)<input id="as-nombre" maxlength="30" required></label>
        <label class="field">Siglas (3 letras)<input id="as-siglas" maxlength="3" required style="text-transform:uppercase"></label>
        <label class="field">Color<input id="as-color" type="color" value="#ff3b3b"></label>
        <p class="small muted">Cuesta $5.000 del juego, o es gratis si tienes VIP.</p>
        <button class="btn main" type="submit">Crear</button></form>`;
    el.querySelector('#form-asoc').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      try {
        const vip = (st.ctx.Api.estado || {}).vip_activo;
        if (!vip && st.ctx.pagarAsociacion && !st.ctx.pagarAsociacion(5000)) return;
        await st.ctx.Api.crearAsociacion({ nombre: el.querySelector('#as-nombre').value.trim(), siglas: el.querySelector('#as-siglas').value.trim().toUpperCase(),
          color: el.querySelector('#as-color').value, pagado_en_juego: !vip });
        await st.ctx.Api.refrescar();
        st.ctx.toast('¡Asociación creada! Ya eres su presidente.'); st.ctx.snd.play('chapter');
        abrir();
      } catch (e) { st.ctx.toast(e.message); st.ctx.snd.play('error'); }
    });
  }

  function opcionesMensaje(id) {
    const m = st.mensajes[st.canal].find((x) => x.id === id);
    if (!m) return;
    st.ctx.ask(`Mensaje de <b>${esc(m.alias || 'Productora')}</b>: "${esc(m.texto)}"<br><br>¿Lo reportas por ofensivo o estafa? También dejarás de ver sus mensajes.`, 'Reportar y bloquear', async () => {
      try { await st.ctx.Api.reportar(id, 'ofensivo'); await st.ctx.Api.bloquear(m.jugador_id); st.mensajes[st.canal] = st.mensajes[st.canal].filter((x) => x.jugador_id !== m.jugador_id); st.ctx.toast('Gracias. Lo revisaremos.'); }
      catch (e) { st.ctx.toast(e.message); }
      abrir();
    });
  }

  root.Chat = {
    iniciar(ctx) {
      if (st.ctx) { st.ctx = ctx; pintarBoton(); return; }
      st.ctx = ctx;
      construir();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') ciclo(); });
      ciclo();
    },
    refrescar() { if (st.ctx) { pintarBoton(); if (st.abierto) abrir(); } },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* EN VIVO Tycoon — efectos de sonido y ambiente.
   Todo se sintetiza con la Web Audio API (sin archivos, sin librerías, sin red).

   API (window.Sound):
     Sound.unlock()          crea/reanuda el AudioContext (llamar desde un toque del usuario).
     Sound.play(name, arg)   reproduce un efecto. 'stars' acepta arg = 1..5.
     Sound.ambience(kind)    'crowd' | 'room' | null (detener). Una sola a la vez.
     Sound.setMuted(bool)    silencia / activa (se guarda en localStorage 'envivo_muted').
     Sound.isMuted()         devuelve true/false.
     Sound.names             lista de nombres válidos para play().

   Si no hay AudioContext (Node, navegador viejo) o algo falla, todo es no-op:
   nunca lanza errores. */
(function (root) {
  'use strict';

  var MASTER_VOL = 0.35;
  var STORE_KEY = 'envivo_muted';
  var FADE = 0.5;

  var ctx = null;          // AudioContext real
  var chainIn = null;      // entrada del bus maestro
  var muted = false;
  var wantAmb = null;      // ambiente pedido por el juego
  var amb = null;          // { kind, gain, nodes[] } ambiente sonando
  var lastPlay = {};       // anti-spam por nombre

  // ---------- estado persistido ----------
  try {
    if (typeof localStorage !== 'undefined' && localStorage) {
      muted = localStorage.getItem(STORE_KEY) === '1';
    }
  } catch (e) { muted = false; }

  function saveMuted() {
    try {
      if (typeof localStorage !== 'undefined' && localStorage) {
        localStorage.setItem(STORE_KEY, muted ? '1' : '0');
      }
    } catch (e) { /* almacenamiento bloqueado: ignorar */ }
  }

  function getCtor() {
    try {
      if (typeof window === 'undefined') return null;
      return window.AudioContext || window.webkitAudioContext || null;
    } catch (e) { return null; }
  }

  // ---------- utilidades ----------
  // Pseudoaleatorio con semilla, para que los sonidos sean siempre iguales.
  function rng(seed) {
    var s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  // Bus maestro: ganancia -> compresor suave (evita picos) -> salida.
  function buildChain(c, dest) {
    var g = c.createGain();
    g.gain.value = muted ? 0 : MASTER_VOL;
    var comp = null;
    try {
      comp = c.createDynamicsCompressor();
      comp.threshold.value = -10;
      comp.knee.value = 8;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.2;
    } catch (e) { comp = null; }
    if (comp) { g.connect(comp); comp.connect(dest || c.destination); }
    else g.connect(dest || c.destination);
    return g;
  }

  function noiseBuffer(c, kind) {
    var cache = c.__envivoNoise || (c.__envivoNoise = {});
    if (cache[kind]) return cache[kind];
    var secs = kind === 'loop' ? 4 : 2;
    var len = Math.floor(c.sampleRate * secs);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    var r = rng(kind === 'loop' ? 777 : 1234);
    if (kind === 'loop') {
      // ruido rosado (Paul Kellet, versión económica): más cálido para el murmullo
      var b0 = 0, b1 = 0, b2 = 0;
      for (var i = 0; i < len; i++) {
        var w = r() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.0990460;
        b1 = 0.96300 * b1 + w * 0.2965164;
        b2 = 0.57000 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
      }
      // fundido de los bordes para que el bucle no haga clic
      var f = Math.floor(c.sampleRate * 0.05);
      for (var j = 0; j < f; j++) {
        var k = j / f;
        d[j] *= k; d[len - 1 - j] *= k;
      }
    } else {
      for (var n = 0; n < len; n++) d[n] = r() * 2 - 1;
    }
    cache[kind] = buf;
    return buf;
  }

  // Envolvente: 0 -> vol (attack) -> 0 (hasta dur). Siempre termina en silencio.
  function env(param, t, vol, attack, dur, curve) {
    var a = Math.max(0.002, attack || 0.005);
    var end = t + Math.max(dur, a + 0.01);
    param.setValueAtTime(0.0001, t);
    param.linearRampToValueAtTime(vol, t + a);
    if (curve === 'lin') param.linearRampToValueAtTime(0.0001, end);
    else param.exponentialRampToValueAtTime(0.0001, end);
    param.setValueAtTime(0, end + 0.005);
    return end;
  }

  // Tono simple. o: {type, attack, to (frecuencia final), lp (filtro), detune, curve, vib, vibRate}
  function tone(c, out, t, freq, dur, vol, o) {
    o = o || {};
    var osc = c.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) {
      if (o.toLin) osc.frequency.linearRampToValueAtTime(o.to, t + dur);
      else osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    }
    if (o.detune) osc.detune.value = o.detune;
    var g = c.createGain();
    var node = osc;
    if (o.lp) {
      var f = c.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(o.lp, t);
      if (o.lpTo) f.frequency.exponentialRampToValueAtTime(o.lpTo, t + dur);
      f.Q.value = o.q || 0.7;
      osc.connect(f); node = f;
    }
    if (o.vib) {
      var lfo = c.createOscillator();
      var lg = c.createGain();
      lfo.frequency.value = o.vibRate || 6;
      lg.gain.value = o.vib;
      lfo.connect(lg); lg.connect(osc.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    node.connect(g); g.connect(out);
    var end = env(g.gain, t, vol, o.attack, dur, o.curve);
    osc.start(t); osc.stop(end + 0.02);
    return end;
  }

  // Ráfaga de ruido filtrado. o: {ft (tipo filtro), f, fTo, q, attack, curve, hp, offset}
  function noise(c, out, t, dur, vol, o) {
    o = o || {};
    var src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 'white');
    src.loop = true;
    var f = c.createBiquadFilter();
    f.type = o.ft || 'bandpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.fTo) f.frequency.exponentialRampToValueAtTime(o.fTo, t + dur);
    f.Q.value = o.q || 0.8;
    var g = c.createGain();
    src.connect(f);
    var last = f;
    if (o.hp) {
      var h = c.createBiquadFilter();
      h.type = 'highpass'; h.frequency.value = o.hp;
      f.connect(h); last = h;
    }
    last.connect(g); g.connect(out);
    var end = env(g.gain, t, vol, o.attack, dur, o.curve);
    src.start(t, (o.offset || 0) % 1.5); src.stop(end + 0.02);
    return end;
  }

  function hz(semis) { return 440 * Math.pow(2, semis / 12); } // 0 = A4
  var C5 = hz(3), D5 = hz(5), E5 = hz(7), G5 = hz(10), A5 = hz(12), B5 = hz(14),
      C6 = hz(15), E6 = hz(19), G6 = hz(22), G4 = hz(-2), E4 = hz(-5), C4 = hz(-9);

  // ---------- catálogo de efectos ----------
  // Cada uno: function (c, out, t, arg) -> devuelve el tiempo final aproximado.
  var SFX = {
    tap: function (c, o, t) {
      return tone(c, o, t, 880, 0.07, 0.5, { to: 620, attack: 0.003 });
    },

    buy: function (c, o, t) {
      // mecanismo de caja: dos clics + "ka-ching"
      noise(c, o, t, 0.03, 0.35, { f: 3000, q: 1.2, attack: 0.002 });
      noise(c, o, t + 0.07, 0.03, 0.3, { f: 2200, q: 1.2, attack: 0.002 });
      tone(c, o, t + 0.12, 2093, 0.5, 0.22, { attack: 0.003 });
      tone(c, o, t + 0.12, 2637, 0.45, 0.14, { attack: 0.003 });
      tone(c, o, t + 0.2, 3136, 0.55, 0.12, { attack: 0.003 });
      return t + 0.8;
    },

    hire: function (c, o, t) {
      var ns = [C5, E5, G5, C6];
      for (var i = 0; i < ns.length; i++) {
        tone(c, o, t + i * 0.08, ns[i], i === 3 ? 0.5 : 0.22, 0.24, { type: 'triangle', attack: 0.005 });
      }
      return t + 0.8;
    },

    error: function (c, o, t) {
      tone(c, o, t, 150, 0.13, 0.3, { type: 'square', lp: 700, attack: 0.005 });
      tone(c, o, t + 0.16, 130, 0.18, 0.3, { type: 'square', lp: 600, attack: 0.005 });
      return t + 0.4;
    },

    live: function (c, o, t) {
      // barrido ascendente + golpe de acorde: "¡AL AIRE!"
      tone(c, o, t, 180, 0.35, 0.16, { type: 'sawtooth', to: 880, lp: 600, lpTo: 4000, attack: 0.2, curve: 'lin' });
      noise(c, o, t, 0.35, 0.12, { ft: 'highpass', f: 1500, attack: 0.3, curve: 'lin' });
      var hit = t + 0.35;
      noise(c, o, hit, 0.25, 0.28, { f: 2500, q: 0.5, attack: 0.002 });
      tone(c, o, hit, 110, 0.45, 0.4, { to: 55, attack: 0.003 });
      var ch = [hz(0), hz(4), hz(7), hz(12)];
      for (var i = 0; i < ch.length; i++) {
        tone(c, o, hit, ch[i], 0.7, 0.13, { type: 'sawtooth', lp: 2600, lpTo: 900, attack: 0.008, detune: (i % 2 ? 6 : -6) });
      }
      return hit + 0.8;
    },

    incident: function (c, o, t) {
      for (var i = 0; i < 3; i++) {
        tone(c, o, t + i * 0.24, 880, 0.11, 0.2, { type: 'square', lp: 2200, attack: 0.004, curve: 'lin' });
        tone(c, o, t + i * 0.24 + 0.12, 660, 0.11, 0.2, { type: 'square', lp: 2000, attack: 0.004, curve: 'lin' });
      }
      return t + 0.75;
    },

    good: function (c, o, t) {
      tone(c, o, t, E5, 0.14, 0.26, { type: 'triangle' });
      tone(c, o, t + 0.1, A5, 0.35, 0.26, { type: 'triangle' });
      tone(c, o, t + 0.1, hz(16), 0.35, 0.08, { type: 'sine' });
      return t + 0.5;
    },

    bad: function (c, o, t) {
      tone(c, o, t, G4, 0.2, 0.26, { type: 'triangle', detune: -10 });
      tone(c, o, t + 0.18, hz(-6), 0.45, 0.26, { type: 'triangle', to: hz(-7), detune: -15 });
      return t + 0.7;
    },

    stars: function (c, o, t, n) {
      n = Math.max(1, Math.min(5, Math.round(+n || 3)));
      var scale = [C5, E5, G5, C6, E6, G6];
      var step = 0.11;
      var end = t;
      if (n <= 2) {
        // resultado flojo: dos o tres notas tranquilas, quinta abierta
        var low = [C5, D5, E5];
        for (var i = 0; i <= n; i++) end = tone(c, o, t + i * 0.16, low[i], 0.3, 0.2, { type: 'triangle' });
        var tt = t + (n + 1) * 0.16;
        tone(c, o, tt, C5, 0.6, 0.12, { type: 'triangle' });
        end = tone(c, o, tt, G5, 0.6, 0.1, { type: 'triangle' });
        return end;
      }
      for (var k = 0; k <= n; k++) {
        tone(c, o, t + k * step, scale[k], 0.25, 0.2, { type: 'triangle' });
        // "estrellita" brillante encima
        tone(c, o, t + k * step, scale[k] * 2, 0.12, 0.05, { type: 'sine' });
      }
      var ct = t + (n + 1) * step;
      var dur = 0.4 + n * 0.18;
      var chord = n >= 5 ? [C5, E5, G5, C6, E6] : n === 4 ? [C5, E5, G5, C6] : [C5, E5, G5];
      for (var j = 0; j < chord.length; j++) {
        end = tone(c, o, ct, chord[j], dur, 0.11, { type: 'triangle', attack: 0.01, vib: n >= 4 ? 3 : 0, vibRate: 5 });
      }
      if (n >= 4) noise(c, o, ct, dur, 0.06, { ft: 'highpass', f: 6000, attack: 0.01 });
      return end;
    },

    chapter: function (c, o, t) {
      // fanfarria de metales (sierra filtrada)
      var seq = [[G4, 0, 0.12], [G4, 0.14, 0.12], [G4, 0.28, 0.12], [C5, 0.42, 0.5], [E5, 0.9, 0.16], [G5, 1.06, 0.16]];
      for (var i = 0; i < seq.length; i++) {
        tone(c, o, t + seq[i][1], seq[i][0], seq[i][2], 0.2, { type: 'sawtooth', lp: 2200, attack: 0.02, curve: 'lin' });
      }
      var ct = t + 1.24;
      var chord = [C4, C5, E5, G5, C6];
      for (var j = 0; j < chord.length; j++) {
        tone(c, o, ct, chord[j], 1.3, 0.1, { type: 'sawtooth', lp: 2800, lpTo: 1200, attack: 0.03, detune: (j % 2 ? 5 : -5), vib: 2.5, vibRate: 5 });
      }
      noise(c, o, ct - 0.25, 1.4, 0.1, { ft: 'highpass', f: 5000, attack: 0.3 });
      tone(c, o, ct, 65, 0.6, 0.35, { to: 45 });
      return ct + 1.4;
    },

    day: function (c, o, t) {
      tone(c, o, t, C5, 0.7, 0.14, { attack: 0.08 });
      tone(c, o, t + 0.18, G5, 0.8, 0.12, { attack: 0.08 });
      tone(c, o, t + 0.36, E6, 0.9, 0.06, { attack: 0.1 });
      return t + 1.3;
    },

    // ---- imprevistos ----
    cable: function (c, o, t) {
      tone(c, o, t, 2400, 0.16, 0.16, { type: 'sawtooth', to: 90, lp: 5000 });
      var r = rng(42);
      for (var i = 0; i < 7; i++) {
        var tt = t + 0.02 + r() * 0.35;
        noise(c, o, tt, 0.02 + r() * 0.03, 0.25 + r() * 0.2, { f: 2500 + r() * 4000, q: 1.5, attack: 0.001 });
      }
      tone(c, o, t + 0.05, 120, 0.3, 0.1, { type: 'square', lp: 800, curve: 'lin' });
      return t + 0.5;
    },

    internet: function (c, o, t) {
      var fs = [1200, 2400, 1800, 2400, 1200, 980, 2100, 1500, 600];
      var d = 0;
      for (var i = 0; i < fs.length; i++) {
        var len = i % 3 === 2 ? 0.08 : 0.045;
        tone(c, o, t + d, fs[i], len, 0.12, { type: 'square', lp: 3500, attack: 0.002, curve: 'lin' });
        d += len + 0.025;
      }
      // "se cae": tono bajando
      tone(c, o, t + d, 900, 0.3, 0.12, { type: 'square', to: 200, lp: 1500 });
      return t + d + 0.35;
    },

    luz: function (c, o, t) {
      noise(c, o, t, 0.03, 0.35, { f: 1800, q: 1, attack: 0.001 });
      tone(c, o, t, 220, 0.9, 0.22, { type: 'sawtooth', to: 28, lp: 2200, lpTo: 90, attack: 0.01, curve: 'lin' });
      tone(c, o, t, 110, 0.9, 0.2, { to: 20, attack: 0.01, curve: 'lin' });
      noise(c, o, t, 0.8, 0.15, { ft: 'lowpass', f: 3000, fTo: 150, attack: 0.02 });
      return t + 1.0;
    },

    lluvia: function (c, o, t) {
      noise(c, o, t, 2.6, 0.32, { f: 3200, q: 0.4, attack: 0.5, curve: 'lin', hp: 600 });
      noise(c, o, t, 2.6, 0.18, { ft: 'lowpass', f: 900, attack: 0.6, curve: 'lin', offset: 0.7 });
      var r = rng(99);
      for (var i = 0; i < 14; i++) {
        var tt = t + 0.3 + r() * 1.9;
        tone(c, o, tt, 2500 + r() * 2500, 0.03, 0.03 + r() * 0.03, { attack: 0.001, to: 1500 });
      }
      return t + 2.7;
    },

    tarde: function (c, o, t) {
      for (var i = 0; i < 6; i++) {
        var tt = t + i * 0.28;
        noise(c, o, tt, 0.025, 0.4, { f: i % 2 ? 2200 : 3200, q: 4, attack: 0.001 });
        tone(c, o, tt, i % 2 ? 1400 : 1900, 0.03, 0.08, { attack: 0.001 });
      }
      return t + 1.7;
    },

    acople: function (c, o, t) {
      // pitido de retroalimentación: corto y contenido
      var osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2300, t);
      osc.frequency.linearRampToValueAtTime(2650, t + 0.45);
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.13, t + 0.42);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.58);
      g.gain.setValueAtTime(0, t + 0.6);
      osc.connect(g); g.connect(o);
      osc.start(t); osc.stop(t + 0.62);
      tone(c, o, t + 0.05, 2300 * 1.5, 0.45, 0.025, { attack: 0.35, curve: 'lin' });
      return t + 0.62;
    },

    bateria: function (c, o, t) {
      tone(c, o, t, 880, 0.12, 0.22, { type: 'square', lp: 2000, attack: 0.004, curve: 'lin' });
      tone(c, o, t + 0.2, 587, 0.2, 0.22, { type: 'square', lp: 1600, attack: 0.004, curve: 'lin' });
      return t + 0.45;
    },

    logo: function (c, o, t) {
      tone(c, o, t, 1568, 0.7, 0.24, { attack: 0.002 });
      tone(c, o, t, 1568 * 2.76, 0.3, 0.05, { attack: 0.002 });
      tone(c, o, t + 0.12, 2093, 0.8, 0.16, { attack: 0.002 });
      return t + 0.95;
    },

    falla: function (c, o, t) {
      var r = rng(7);
      var d = 0;
      for (var i = 0; i < 12; i++) {
        var len = 0.015 + r() * 0.04;
        if (r() < 0.55) noise(c, o, t + d, len, 0.2 + r() * 0.2, { f: 400 + r() * 5000, q: 0.8 + r() * 3, attack: 0.001, curve: 'lin' });
        else tone(c, o, t + d, 80 + r() * 900, len, 0.12, { type: 'square', lp: 3000, attack: 0.001, curve: 'lin' });
        d += len + r() * 0.03;
      }
      return t + d + 0.05;
    },

    epico: function (c, o, t) {
      // ovación del público: ruido que crece y se va
      noise(c, o, t, 2.4, 0.3, { f: 900, q: 0.6, attack: 0.7 });
      noise(c, o, t, 2.4, 0.16, { f: 2400, q: 0.7, attack: 0.9, offset: 0.4 });
      noise(c, o, t, 2.2, 0.12, { ft: 'lowpass', f: 400, attack: 0.6, offset: 0.9 });
      // silbido de dos tonos
      var w = t + 0.5;
      tone(c, o, w, 1900, 0.22, 0.07, { to: 2700, attack: 0.03, curve: 'lin' });
      tone(c, o, w + 0.28, 2700, 0.4, 0.07, { to: 1800, attack: 0.02, vib: 30, vibRate: 9 });
      return t + 2.5;
    },

    vip: function (c, o, t) {
      for (var i = 0; i < 3; i++) {
        var tt = t + i * 0.2;
        noise(c, o, tt, 0.018, 0.4, { ft: 'highpass', f: 2500, attack: 0.001 });
        noise(c, o, tt + 0.05, 0.035, 0.3, { f: 1500, q: 1.2, attack: 0.001 });
      }
      return t + 0.7;
    },
  };

  var NAMES = Object.keys(SFX);

  // Dibuja un efecto en cualquier contexto (real u offline). Uso interno y pruebas.
  function renderInto(c, out, name, arg, t) {
    var fn = SFX[name];
    if (!fn) return 0;
    return fn(c, out, t == null ? c.currentTime + 0.01 : t, arg);
  }

  // ---------- ambiente ----------
  function startAmbience(kind) {
    if (!ctx || !chainIn) return;
    var c = ctx, t = c.currentTime;
    var nodes = [];
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.connect(chainIn);
    var target = kind === 'crowd' ? 0.55 : 0.22;
    var src = c.createBufferSource();
    src.buffer = noiseBuffer(c, 'loop');
    src.loop = true;
    nodes.push(src);
    if (kind === 'crowd') {
      // murmullo de estadio: dos bandas de voz + leve "oleaje"
      var b1 = c.createBiquadFilter(); b1.type = 'bandpass'; b1.frequency.value = 450; b1.Q.value = 0.7;
      var b2 = c.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = 1300; b2.Q.value = 0.9;
      var g1 = c.createGain(); g1.gain.value = 0.7;
      var g2 = c.createGain(); g2.gain.value = 0.3;
      src.connect(b1); b1.connect(g1); g1.connect(g);
      src.connect(b2); b2.connect(g2); g2.connect(g);
      var lfo = c.createOscillator(); lfo.frequency.value = 0.13;
      var lg = c.createGain(); lg.gain.value = 0.25;
      lfo.connect(lg); lg.connect(g1.gain);
      var lfo2 = c.createOscillator(); lfo2.frequency.value = 0.31;
      var lg2 = c.createGain(); lg2.gain.value = 120;
      lfo2.connect(lg2); lg2.connect(b2.frequency);
      lfo.start(t); lfo2.start(t);
      nodes.push(lfo, lfo2);
    } else {
      // sala interior: murmullo muy bajo, grave
      var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.5;
      var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 1.2;
      var gb = c.createGain(); gb.gain.value = 0.25;
      src.connect(lp); lp.connect(g);
      src.connect(bp); bp.connect(gb); gb.connect(g);
      var lfo3 = c.createOscillator(); lfo3.frequency.value = 0.09;
      var lg3 = c.createGain(); lg3.gain.value = 0.12;
      lfo3.connect(lg3); lg3.connect(gb.gain);
      lfo3.start(t);
      nodes.push(lfo3);
    }
    src.start(t);
    g.gain.exponentialRampToValueAtTime(target, t + FADE);
    amb = { kind: kind, gain: g, nodes: nodes };
  }

  function stopAmbience() {
    if (!amb) return;
    var a = amb; amb = null;
    try {
      var t = ctx.currentTime;
      a.gain.gain.cancelScheduledValues(t);
      a.gain.gain.setValueAtTime(Math.max(0.0001, a.gain.gain.value), t);
      a.gain.gain.exponentialRampToValueAtTime(0.0001, t + FADE);
      for (var i = 0; i < a.nodes.length; i++) {
        try { a.nodes[i].stop(t + FADE + 0.05); } catch (e) { /* ya detenido */ }
      }
      setTimeout(function () { try { a.gain.disconnect(); } catch (e) { /* nada */ } }, (FADE + 0.2) * 1000);
    } catch (e) { /* nada */ }
  }

  function syncAmbience() {
    try {
      var desired = muted ? null : wantAmb;
      if (amb && amb.kind === desired) return;
      if (amb) stopAmbience();
      if (desired && ctx) startAmbience(desired);
    } catch (e) { /* silencioso */ }
  }

  // ---------- API pública ----------
  function unlock() {
    try {
      if (!ctx) {
        var Ctor = getCtor();
        if (!Ctor) return;
        ctx = new Ctor();
        chainIn = buildChain(ctx);
        // truco iOS: reproducir un búfer silencioso dentro del gesto
        try {
          var b = ctx.createBuffer(1, 1, 22050);
          var s = ctx.createBufferSource();
          s.buffer = b; s.connect(ctx.destination); s.start(0);
        } catch (e) { /* nada */ }
        try {
          if (typeof document !== 'undefined' && document.addEventListener) {
            document.addEventListener('visibilitychange', function () {
              try {
                if (!ctx) return;
                if (document.hidden) ctx.suspend();
                else ctx.resume();
              } catch (e) { /* nada */ }
            });
          }
        } catch (e) { /* nada */ }
      }
      if (ctx.state === 'suspended' && ctx.resume) {
        var p = ctx.resume();
        if (p && p.catch) p.catch(function () {});
      }
      syncAmbience();
    } catch (e) { ctx = null; chainIn = null; }
  }

  function play(name, arg) {
    try {
      if (muted || !ctx || !chainIn || !SFX[name]) return;
      if (ctx.state === 'suspended' && ctx.resume) {
        var p = ctx.resume();
        if (p && p.catch) p.catch(function () {});
      }
      var now = Date.now();
      if (lastPlay[name] && now - lastPlay[name] < 40) return; // evita amontonar el mismo sonido
      lastPlay[name] = now;
      renderInto(ctx, chainIn, name, arg);
    } catch (e) { /* silencioso */ }
  }

  function ambience(kind) {
    try {
      wantAmb = kind === 'crowd' || kind === 'room' ? kind : null;
      syncAmbience();
    } catch (e) { /* silencioso */ }
  }

  function setMuted(v) {
    try {
      muted = !!v;
      saveMuted();
      if (ctx && chainIn) {
        var t = ctx.currentTime;
        chainIn.gain.cancelScheduledValues(t);
        chainIn.gain.setValueAtTime(chainIn.gain.value, t);
        chainIn.gain.linearRampToValueAtTime(muted ? 0 : MASTER_VOL, t + 0.08);
      }
      syncAmbience();
    } catch (e) { /* silencioso */ }
  }

  function isMuted() { return muted; }

  var Sound = {
    unlock: unlock,
    play: play,
    ambience: ambience,
    setMuted: setMuted,
    isMuted: isMuted,
    names: NAMES.slice(),
    // Solo para pruebas: dibuja un efecto (con el bus maestro) en un contexto dado,
    // p. ej. un OfflineAudioContext. Devuelve el tiempo final.
    _render: function (c, name, arg) {
      try {
        var bus = buildChain(c, c.destination);
        bus.gain.value = MASTER_VOL;
        return renderInto(c, bus, name, arg, 0.01);
      } catch (e) { return 0; }
    },
  };

  try { if (root) root.Sound = Sound; } catch (e) { /* nada */ }
  if (typeof module !== 'undefined' && module && module.exports) module.exports = Sound;
})(typeof window !== 'undefined' ? window : null);

<script>
/* =========================================================
   EN VIVO Tycoon — Pantallas (interfaz)
